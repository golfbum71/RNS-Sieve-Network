node:
  id: BrunTruncation.v1
  family: BrunTruncation
  version: v1
  order: 66
  kind: paper
  status: active
  improves: BrunPureSieve stops inclusion-exclusion early for counts; this node does the same for the
    product of one minus each wheel's share, with the size of the error, stage 3 of Brun's theorem.
  title: stopping inclusion-exclusion early for a product of shares (Brun stage 3)
  description: With shares between zero and one, inclusion-exclusion for the product of one minus each
    share, stopped after the sets of at most some number of wheels, overestimates at an even stopping
    point and underestimates at an odd one, by at most the sum over sets of one more wheel of the
    product of their shares; that sum is at most the total share to that power over its factorial.
conclusions:
