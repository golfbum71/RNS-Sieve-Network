  kind: paper
  status: active
  title: "Dickson's conjecture gives Sophie Germain primes"
  description: >-
    The pair "a number and twice it plus one" passes the linear-forms version
    of admissibility; so Dickson's conjecture would give infinitely many
    Sophie Germain primes.

