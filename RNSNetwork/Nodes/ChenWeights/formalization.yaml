  order: 100
  kind: paper
  status: planned
  title: Chen's weights for numbers with at most two prime factors
  description: For numbers between x to the 2/3 and x, being prime or a product of two primes is at least
    one, minus half the count of primes up to the cube root dividing it, minus half the count of its factorizations
    into three primes with only the first below the cube root, minus half the count of small primes whose
    square divides it. A finite inequality on factorizations; the weight Chen's theorem sieves with. Tao,
    Supplement 5, Lemma 11.
conclusions: []
planned:
  source_status: New
  rests_on: []
  claims:
  - chen_weight_le
  tier: 'Tier 1: a case split on how many prime factors lie below the cube root.'
  plan: If no prime factor is below the cube root, at most two factors exist; one small factor leaves
    a cofactor below x^(2/3) with at most one more split; two or more small factors make the subtracted
    terms at least 1.
sources:
