node:
  id: LehmerExcess.v1
  family: LehmerExcess
  version: v1
  order: 34
  kind: paper
  status: active
  title: Lehmer's closed form for the 6n-1 type
  description: When every wheel leaves remainder one less than the number of intervals (for six intervals,
    every wheel on the 6n-1 side), the survivor count's excess over its proportional share at the
    end of each interval has an exact closed form, of size two to the number of wheels times the
    distance of the fraction from one half. The 6n-1 side of Lehmer's picture, and the natural partner
    to UniformSubdivision's 6n-1-side claim. Checked numerically beforehand on 1,479 cases.
conclusions:
- id: lehmer_excess_closed_form
  declaration: RNS.LehmerExcess.lehmer_excess_closed_form
  summary: With every wheel one short of the number of intervals, twice the number of intervals times
    the excess at the end of each interval is minus (minus one to the number of wheels) times two
    to the number of wheels times (twice the count of intervals minus their number).
  imports:
  - Sawtooth.v1.sawtooth_identity
  imports_status: identified
  justifications:
