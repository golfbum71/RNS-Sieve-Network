# Node metadata, following the shape of IEANTN's formalization.yaml.
# See docs/NODE_LIST.md for the plain-language list of all nodes.

node:
  id: UniformSubdivision.v1
  family: UniformSubdivision
  version: v1
  order: 21
  kind: paper
  status: active
  title: equal shares of survivors in equal intervals
  description: With one wheel rotating and the rest frozen, the full cycle splits into as
    many equal intervals as the rotating wheel's size minus one, each holding one frozen cycle's
    worth of survivors. By column, a rotating wheel on the 6n+1 side keeps every column's
    share exact; one on the 6n-1 side swaps columns, so each interval is off by the two columns'
    difference in the overhang.
conclusions:
- id: frozen_wheels_repeat
  declaration: RNS.UniformSubdivision.frozen_wheels_repeat
  summary: 'Survivors of a set of wheels repeat with the cycle: up to some number of full
    cycles plus a remainder, the count is that many cycles'' worth plus the count up to the
    remainder.'
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/UniformSubdivision.lean
    declaration: RNS.UniformSubdivision.frozen_wheels_repeat_holds
    note: Complete Lean proof checked by `lake build RNSSolutions` (standard axioms only,
      2026-11-04). Recorded as noncompliant only because no Comparator receipt exists yet.
  designated: lean-proof
- id: one_wheel_removed
  declaration: RNS.UniformSubdivision.one_wheel_removed
  summary: Adding a new prime wheel removes exactly its multiples, which match one-for-one
    the old survivors up to the bound divided by the new prime (Meissel's identity).
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/UniformSubdivision.lean
    declaration: RNS.UniformSubdivision.one_wheel_removed_holds
    note: Complete Lean proof checked by `lake build RNSSolutions` (standard axioms only,
      2026-11-04). Recorded as noncompliant only because no Comparator receipt exists yet.
  designated: lean-proof
- id: uniform_subdivision
  declaration: RNS.UniformSubdivision.uniform_subdivision
  summary: With one wheel rotating, the full cycle splits into as many equal intervals as
    the rotating wheel's size minus one, each holding one frozen cycle's worth of survivors
    (a case of Lehmer 1955, Theorem 4).
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/UniformSubdivision.lean
    declaration: RNS.UniformSubdivision.uniform_subdivision_holds
    note: Complete Lean proof checked by `lake build RNSSolutions` (standard axioms only,
      2026-11-04). Recorded as noncompliant only because no Comparator receipt exists yet.
  designated: lean-proof
- id: uniform_subdivision_plus_side
  declaration: RNS.UniformSubdivision.uniform_subdivision_plus_side
  summary: For a rotating wheel on the 6n+1 side, with 2 and 3 frozen, each column gets exactly
    its share in every interval.
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/UniformSubdivision.lean
    declaration: RNS.UniformSubdivision.uniform_subdivision_plus_side_holds
    note: Complete Lean proof checked by `lake build RNSSolutions` (standard axioms only,
      2026-11-04). Recorded as noncompliant only because no Comparator receipt exists yet.
  designated: lean-proof
- id: uniform_subdivision_minus_side
  declaration: RNS.UniformSubdivision.uniform_subdivision_minus_side
  summary: For a rotating wheel on the 6n-1 side, with 2 and 3 frozen, each column's count
    differs from its share by the two columns' difference in the overhang.
  imports: []
  imports_status: none
  justifications:
