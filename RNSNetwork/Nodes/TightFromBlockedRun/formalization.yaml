node:
  id: TightFromBlockedRun.v1
  family: TightFromBlockedRun
  version: v1
  order: 127
  kind: paper
  status: active
  group: lonely
  title: a run of blocked numbers makes a tight lonely runner
  description: 'The consecutive speeds 1 up to one less than the number of runners are tight: the time
    one over the number of runners gives every runner one part of a lap of room, and no time gives more
    (Dirichlet''s pigeonhole). Speed up the runner of speed r to m times its speed. If every number from
    the number of runners minus r up to m times that, minus one, shares a factor with r (a run of positions
    blocked by the wheels of r), the new set is still tight. The proof replaces one runner at a time (Goddyn
    and Wong''s Lemma 3.2): at a time when only the sped-up runner could have been close, either a smaller
    wheel of r takes its place, or an unchanged runner whose speed is the inverse remainder for r does,
    and the blocked run is exactly what keeps that runner unchanged. A blocked run is shorter than the
    speed that blocks it, which keeps the sped-up runner off the fence post at the time one over the number
    of runners. This is the wheel-native part of the link between tight lonely runners and Jacobsthal''s
    problem (JacobsthalTightness): the longer the blocked runs of a wheel cycle, the more a runner can
    be sped up. Goddyn and Wong 2006, Theorem 2.1 (sufficiency direction) and Lemma 3.2, at times that
    are fractions; never strictly lonely means every fractional time has a runner at most one part from
    the start. Not proved: the necessity direction, the several-runner Theorem 3.1, and real times.'
