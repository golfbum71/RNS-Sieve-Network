node:
  id: Pruning.v1
  family: Pruning
  version: v1
  order: 8
  kind: paper
  status: active
  title: "which starting positions are worth testing"
  description: >-
    Once the Lagrange–Waring condition is met, the number of starting
    positions left to test for an evenly spaced prime run is an exact product
    over the wheels: one fewer than the wheel size where the wheel divides the
    spacing, and the run length fewer elsewhere.

conclusions:
  - id: valid_starting_residues_card_formula
    declaration: RNS.Pruning.valid_starting_residues_card_formula
    summary: "Once the Lagrange-Waring condition holds, the starting positions worth testing number exactly a product over the wheels."
    imports: 
      - SurvivorCount.v1.general_survivor_count
    imports_status: identified
    justifications:
      - id: lean-proof
        kind: lean-noncompliant
        solution: RNSSolutions/Pruning.lean
        declaration: RNS.Pruning.valid_starting_residues_card_formula_step
        assembled: RNSSolutions/Assemble.lean (RNS.Pruning.valid_starting_residues_card_formula_holds)
        note: >-
          Lean proof of the step from the imported claims, taken as named
          hypotheses; the proof file imports claims only, never proofs. Recorded as noncompliant only because no Comparator
          receipt exists yet.
    designated: lean-proof

sources:
