related:
- node: Admissibility
  note: "the Lagrange–Waring condition this node assumes is exactly admissibility of the run's offset pattern (ap_offsets_admissible_iff)"
- node: ShieldCertificates
  note: "ShieldCertificates forces the Lagrange–Waring condition on real prime runs, and its forward and backward certificates prove that a run found among these starting positions is prime"
