  order: 49
  kind: external
  status: planned
  title: blocked runs become long prime gaps
  description: Blocking a run with one residue class per wheel and shifting it by the Chinese Remainder
    Theorem to a start where every member is composite gives long gaps between primes. OpenAI proved in
    Lean that the largest prime gap below X is at least a constant times log X (log log X)^2 log log log
    log X / (log log log X)^2, improving Rankin. The bounds of Westzynthius, Erdős and Rankin would follow
    as short corollaries.
