  - node: WheelOrder
    note: "with no later wheels, its marginal count says each new wheel closes as many positions as there were earlier survivors: one pigeon per survivor, counted in bulk"
  - node: SurvivorCount
    note: "the exact survivor count (the product of each wheel size minus one) that the open copies build up wheel by wheel"
