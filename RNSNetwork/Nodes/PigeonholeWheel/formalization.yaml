# Node metadata, following the shape of IEANTN's formalization.yaml.
# See docs/NODE_LIST.md for the plain-language list of all nodes.

node:
  id: PigeonholeWheel.v1
  family: PigeonholeWheel
  version: v1
  order: 102
  kind: paper
  status: active
  group: foundations
  title: "one pigeon per wheel"
  improves: >-
    A third proof that the primes never run out, next to the two in
    Infinitude: it builds no special number (Euclid) and counts no
    square-free parts, but follows the wheels one at a time, showing by
    pigeonhole that each new wheel closes exactly one copy of every survivor
    and leaves the rest open.
  description: >-
    When a new wheel joins, each position that survived the earlier wheels
    has one copy in the longer cycle for every slot of the new wheel. No two
    copies share a slot, so by the pigeonhole principle every slot receives
    exactly one copy: one copy is closed and the others, one fewer than the
    wheel size, stay open. Starting from the two open positions of wheels 2
    and 3 (the 6n+1 and 6n-1 positions), two survivors are carried through
    every further wheel; if every prime were a wheel, only position 1 would
    be open, so the primes never run out. The per-wheel statement is the
    Chinese Remainder Theorem seen one wheel at a time; the infinitude proof
    is a known variant of Euclid's, related to the proofs through Euler's
    totient function.

