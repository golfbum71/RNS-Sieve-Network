sources:
  - title: "Euclid, Elements, Book IX, Proposition 20 (D. E. Joyce's edition)"
    type: "paper"
    url: "https://mathcs.clarku.edu/~djoyce/elements/bookIX/propIX20.html"
    relationship: "the theorem proved; this node's argument is a counting variant of Euclid's"
  - title: "R. Meštrović, Euclid's theorem on the infinitude of primes: a historical survey of its proofs (300 B.C.-2022)"
    type: "paper"
    url: "https://arxiv.org/abs/1202.3670"
    relationship: "surveys the published proofs, including those through Euler's totient function, to which this survivor-counting proof is related"
  - title: "Chinese remainder theorem (Wikipedia)"
    type: "paper"
    url: "https://en.wikipedia.org/wiki/Chinese_remainder_theorem"
    relationship: "the per-wheel statement is the Chinese Remainder Theorem for one new modulus, proved here by pigeonhole"

related:
