node:
  id: BrunTwinSum.v1
  family: BrunTwinSum
  version: v1
  order: 52
  kind: paper
  status: active
  title: the twin primes' reciprocals add up to a finite total
  description: The reciprocals of the twin primes have a finite sum (Brun's constant, about 1.902),
    whether or not there are infinitely many twin primes. Its sieve heart is the wheel-level twin share
    of ShareBounds. Brun's theorem, cited.
conclusions:
- id: brun_sum_finite
  declaration: RNS.BrunTwinSum.brun_sum_finite
  summary: The twin-prime reciprocals have a finite sum (cited).
  imports: []
  imports_status: none
  justifications:
  - id: paper
    kind: literature
    source: V. Brun, La série 1/5 + 1/7 + 1/11 + 1/13 + ... où les dénominateurs sont nombres premiers
      jumeaux est convergente ou finie, Bull. Sci. Math. 43 (1919)
    locator: main theorem
    note: Published theorem, cited. Not reproduced in this repository.
  - id: outside-lean
    kind: external
    source: lean-eval benchmark problem brun_constant_converges, accepted solutions from June 22 2026
      on (Seed Prover, Aristotle, Tau, GPT-5.6)
    locator: brun_constant_converges, Summable twinPrimeReciprocalTerm
    note: Identified 2026-11-06, not yet checked here. Several machine-generated Lean proofs were
      accepted by the benchmark's checker; most are in private repositories, and the one public gist
      (GPT-5.6, accepted 2026-07-12) could not be read from the build session. Before relying on it,
      read the proof, confirm `#print axioms` shows only the standard three, and match its statement
      to brun_sum_finite.
  designated: paper
