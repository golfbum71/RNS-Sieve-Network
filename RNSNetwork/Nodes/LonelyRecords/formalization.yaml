  version: v1
  order: 122
  kind: paper
  status: planned
  group: lonely
  title: "the Lonely Runner Conjecture and its proved cases, up to fifteen runners (cited)"
  description: "The conjecture (Wills 1967, Cusick 1973): runners with distinct constant speeds start together on a track of length one, and each is at some time at least one over the number of runners from every other. Stated as an open hypothesis, never claimed, in the form of formal-conjectures. Cited as proved cases: up to seven runners (Barajas and Serra 2008, with earlier cases including five by Cusick and Pomerance 1984), eight (Rosenfeld 2025), nine and ten (Trakulthongchai 2026; nine also Rosenfeld), eleven to thirteen (Sungkawichai and Trakulthongchai 2026), fourteen and fifteen (Allikvere 2026, unrefereed preprint; states the computation is not formally verified). Background: Tao's reduction of each case to a finite check (speeds bounded by a power of the field size). None of these proofs is in Lean, which is the opening for ResidueReduction."
