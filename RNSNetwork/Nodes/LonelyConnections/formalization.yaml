node:
  id: LonelyConnections.v1
  family: LonelyConnections
  version: v1
  order: 125
  kind: paper
  status: planned
  group: lonely
  title: the Lonely Runner under other names (cited)
  description: 'Equivalent forms: Wills'' Diophantine approximation (the gap of loneliness; Kronecker''s
    theorem makes the real and whole-number versions equivalent), Cusick''s view-obstruction problem and
    billiard trajectories, the covering radius of lattice zonotopes (Henze and Malikiosis 2017), and the
    Lonely Runner polyhedra of Beck, Hoşten and Schymura. One-way: the conjecture implies a statement
    about nowhere-zero flows in graphs (Bienia, Goddyn, Gvozdjak, Sebő and Tarsi 1998), and colouring
    bounds for distance graphs; coprime mappings (Newman''s conjecture, proved by Pomerance and Selfridge;
    Bohman and Peng) give the conjecture for speed sets with small values. Warning: the shifted version,
    with different starting points, is false from five moving runners on (Blanco, Criado and Santos 2026).
    All cited, none proved here; the real-time equivalence is the one the Lonely Runner nodes rely on
    implicitly.'
conclusions: []
planned:
  source_status: Cited
  rests_on: []
  claims:
  - kronecker_real_to_integer
  - view_obstruction_equiv
  - zonotope_covering_equiv
