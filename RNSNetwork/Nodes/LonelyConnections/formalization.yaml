  tier: Cited claims; kronecker_real_to_integer (real times versus fractional times) is the most useful
    to prove later.
  plan: State each equivalence or implication as a cited claim, matching the survey's statements; the
    real-time equivalence would let the family's fractional-time claims speak about real times.
