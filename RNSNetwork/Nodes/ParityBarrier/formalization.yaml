  claims:
  - liouville_sets_same_shares
  - liouville_sets_differ
  tier: 'Tier 3: needs the Liouville sum to be small compared with x, which is equivalent to the prime
    number theorem.'
  plan: State the sieve data of both sets from the Liouville form of the prime number theorem (an extra
    outside claim; check PNT+ for it), then the two sifted counts.
