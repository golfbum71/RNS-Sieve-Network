node:
  id: ParityBarrier.v1
  family: ParityBarrier
  version: v1
  order: 88
  kind: paper
  status: planned
  title: Selberg's parity example
  description: 'The numbers with an even and with an odd count of prime factors have the same sieve data:
    the multiples of every product of wheels split evenly between the two sets, to within a vanishing error. Yet with the wheels up to the square
    root one set keeps only 1 and the other keeps about all the primes. So wheel densities alone cannot
    tell primes from products of two primes; beating parity needs an ingredient that breaks this example.
    Ford Sections 1.7.4 and 4.2.'
conclusions: []
planned:
