# Node metadata, following the shape of IEANTN's formalization.yaml.
# Lonely Runner family, built 2026-11-23. See docs/NODE_LIST.md.

node:
  id: PileUpLock.v1
  family: PileUpLock
  version: v1
  order: 118
  kind: paper
  status: active
  group: lonely
  title: 'the pile-up: when one runner can be freed while the rest are together'
  description: 'Runners go round a track of length one, each with its own lap time. Pick one runner as
    the target and call the rest the pack. The pack is together at the start exactly at the multiples
    of its combined cycle (the least common multiple of the pack''s lap times), the same way the wheels''
    combined cycle works. At those moments the target stands only on a set of evenly spaced spots, as
    many as the target''s lap time divided by its greatest common factor with the combined cycle. The
    target is freed by the pile-up if and only if its lap time does not divide the combined cycle; then
    it stands at least a third of a lap from the pack, enough for any field of three or more runners.
    When the lap time does divide the cycle (the target is locked), no moment with the whole pack at the
    start separates it. The same holds with the pack together at any shared point, using the greatest
    common factor of the pack''s speed differences. Original to this project (Geo''s pile-up idea, 2026).
    Settled limit, recorded so it is not re-argued: locked targets are the usual case (about 70 percent
    of small sets with three runners, about 99 percent with six, and every runner of the consecutive-speed
    sets from four runners on), so this node frees only some runners and is not a route to the whole conjecture
    by itself. Times are fractions; the usual statement with real times is equivalent (a classical fact,
    not proved here). This node also holds the shared vocabulary of the Lonely Runner family (far, lonely_at,
    has_lonely_time, and lonely_runner_upto as a named hypothesis). As proved, differs from the plan:
    the count of the target''s spots (target_spots_count) is not stated, and freed_third_lap is part of
    pile_up_frees_iff; the pack is any finite family of speeds, so the same claims cover the empty pack
    and packs with repeated speeds.'
conclusions:
- id: pack_together_iff
  declaration: RNS.PileUpLock.pack_together_iff
  summary: All the pack is at the start at a fractional time exactly when the denominator divides the
    greatest common factor of the pack's speeds times the numerator.
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/PileUpLock.lean
    declaration: RNS.PileUpLock.pack_together_iff_holds
    note: Complete Lean proof checked by `lake build RNSSolutions` (standard axioms only, 2026-11-23).
      Recorded as noncompliant only because no Comparator receipt exists yet.
  designated: lean-proof
- id: locked_never_separated
  declaration: RNS.PileUpLock.locked_never_separated
  summary: If the target's speed is a multiple of the pack's greatest common factor, the target is at
    the start whenever the whole pack is.
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/PileUpLock.lean
    declaration: RNS.PileUpLock.locked_never_separated_holds
    note: Complete Lean proof checked by `lake build RNSSolutions` (standard axioms only, 2026-11-23).
      Recorded as noncompliant only because no Comparator receipt exists yet.
  designated: lean-proof
- id: pile_up_frees_iff
  declaration: RNS.PileUpLock.pile_up_frees_iff
  summary: Some moment has the whole pack at the start and the target at least a third of a lap away exactly
    when the target's speed is not a multiple of the pack's greatest common factor.
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/PileUpLock.lean
    declaration: RNS.PileUpLock.pile_up_frees_iff_holds
    note: Complete Lean proof checked by `lake build RNSSolutions` (standard axioms only, 2026-11-23).
      Recorded as noncompliant only because no Comparator receipt exists yet.
  designated: lean-proof
- id: shared_point_pile_up
  declaration: RNS.PileUpLock.shared_point_pile_up
  summary: 'The same with the pack together at any shared point: speeds measured relative to one speed,
    the target is freed exactly when its relative speed is not a multiple of the greatest common factor
    of the pack''s relative speeds.'
  imports:
  - PileUpLock.v1.pile_up_frees_iff
  imports_status: identified
  justifications:
