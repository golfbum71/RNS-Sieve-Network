  order: 40
  kind: external
  status: active
  title: Mertens' third theorem
  description: The survivor share after the wheels up to x (the product over the primes up to x of one
    minus one over the prime) is e to the minus Euler's constant over log x, with an error of order one
    over log x squared. Proved in Lean in PrimeNumberTheoremAnd and taken here as a named hypothesis
    (PNT+ builds on a different toolchain); the limit form used by other nodes is proved here from it.
