node:
  id: MertensThird.v1
  family: MertensThird
  version: v1
  order: 40
  kind: external
  status: active
  title: Mertens' third theorem
  description: The survivor share after the wheels up to x (the product over the primes up to x of one
    minus one over the prime) is e to the minus Euler's constant over log x, times e to a remainder that
    is at most a constant over log x. The remainder bound is proved in Lean in PrimeNumberTheoremAnd
    (no sorry) and copied here word for word as a named hypothesis; the identity and the limit form
    used by other nodes are proved here.
