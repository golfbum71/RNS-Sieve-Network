  family: BrunAnalytic
  version: v1
  order: 69
  kind: paper
  status: active
  improves: Turns BrunTwinBound into a bound on the number of twin primes by choosing the wheels and the
    stopping point; stage 5 of Brun's theorem.
  title: how few twin primes there are (Brun stage 5)
  description: For the wheels below L, the product of one minus each twin share is the twin share of the
    cycle, at most twice one over log L squared. With u the eighth root of log N, the wheels below about e
    to the u to the sixth and the stopping point about 46 u, the twin prime pairs up to N are at most 5 N
    over log N to the three halves, for all N from some point on.
