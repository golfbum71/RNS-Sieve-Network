node:
  id: BrocardWindowLength.v1
  family: BrocardWindowLength
  version: v1
  order: 108
  kind: paper
  status: active
  title: "the window between two prime squares is a multiple of 24"
  description: "For primes from 5 on, the distance from the smaller prime's square to the larger prime's square is a multiple of 24, because each square is one more than a multiple of 24 (UnitSquares24). For primes from 3 on, that distance is at least four times the smaller prime plus 4, because the larger prime is at least the smaller plus 2. For consecutive primes this is the length of the window of Brocard's conjecture. Elementary; the 24 is the point of Geo's mod-24 thread on Brocard windows. It says nothing yet about how the wheels block the window."
  improves: "BrocardWindow gives where each wheel's marks fall inside the window; this node gives the window's own length: a multiple of 24 and at least four times the base prime plus 4."
