  claims:
  - interval_spread_bound
  - column_imbalance_bound
  evidence: Both checked numerically (4,761 cases). The column imbalance reaches 18 at the
    wheels up to 23, against a bound of 128.
  tier: 'Tier 1: inclusion-exclusion.'
