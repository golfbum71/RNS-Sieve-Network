node:
  id: SpreadBounds.v1
  family: SpreadBounds
  version: v1
  order: 24
  kind: paper
  status: active
  title: how unevenly survivors can spread
  description: Any two stretches of the same length hold survivor counts differing by at most two
    to the number of wheels. With wheels 2 and 3 frozen, the two columns' survivor counts up to any
    point differ by at most two to the number of remaining wheels. Both checked numerically beforehand
    (4,761 cases; the column imbalance reaches 18 at the wheels up to 23, against a bound of 128).
