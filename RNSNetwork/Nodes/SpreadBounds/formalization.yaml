  status: planned
  title: how unevenly survivors can spread
  description: Any two equal intervals of the cycle hold survivor counts differing by at most
    two to the number of wheels. With wheels 2 and 3 frozen, the two columns' survivor counts
    up to any point differ by at most two to the number of remaining wheels.
