node:
  id: BirchTateRational.v1
  family: BirchTateRational
  version: v1
  order: 113
  kind: paper
  status: active
  group: onewheel
  title: "24 times ζ(−1) is −2"
  description: "The Riemann zeta function at −1 is −1/12 (from Mathlib's Bernoulli values). The largest cycle on which every open position squares to 1 is 24 (UnitSquares24), and 24 times ζ(−1) is −2. This is the numerical side of the Birch–Tate formula for the rational numbers: the order of K₂ of the integers, 2, equals the size of w₂ times ζ(−1). K₂ is not in Mathlib, so only the numbers are stated. Deligne and Ribet (1980) proved that w₂ times ζ(−1) is a whole number for every totally real field; this node is the rational case of that, in numbers. Classical; the link from the wheel side (open positions squaring to 1) is the point here."
  improves: "UnitSquares24 finds the 24 on the wheels; this node shows it is the same 24 that clears the denominator of ζ(−1)."
