  kind: paper
  status: planned
  group: lonely
  title: tight lonely runners wait on Jacobsthal's problem (cited)
  description: A speed set is tight when the best loneliness is exactly one over the number of runners,
    as for the consecutive speeds. Speeding up some of the consecutive runners can give new tight sets
    when every number in a stretch shares a factor with a given number; that is Jacobsthal's problem,
    the longest run of blocked positions in one wheel cycle (BlockingRuns, LargestGap, KanoldBound, JacobsthalQuadratic).
    Erdős' long blocked runs give tight sets with the fastest speed about twice the field size minus a
    logarithm; Pomerance showed sets with the fastest speed below twice the field size minus a constant
    times the square of a logarithm are not tight. The survey states that closing this gap, and pushing
    the proved range of speeds toward Tao's question (fastest speed at most twice the field size), would
    need better bounds for Jacobsthal's problem. Cited; the bridge from the network's Jacobsthal nodes
    is the RNS-native part to build.
