  family: TwinShare
  version: v1
  order: 27
  kind: paper
  status: active
  title: the twin share of the cycle
  description: Among all survivors of a cycle, the twin survivors make up exactly the product over
    the wheels from 3 up of the wheel size minus 2 over the wheel size minus 1. That product splits
    into the partial twin-prime constant times the coprime share.
