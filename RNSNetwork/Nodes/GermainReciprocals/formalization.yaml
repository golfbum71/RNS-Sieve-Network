node:
  id: GermainReciprocals.v1
  family: GermainReciprocals
  version: v1
  order: 78
  kind: paper
  status: active
  title: the Sophie Germain primes' reciprocals add up to a finite total
  description: "Primes p with 2p + 1 also prime number at most a constant times N over log N squared from some start on, so the sum of their reciprocals is finite. The Sophie Germain pair is the pattern of the two linear forms n and 2n + 1; on every wheel from 3 up they block two different positions (0, and half of the wheel minus one), so no odd wheel is bad and the bad factor of PatternUpperBound is 1. The reciprocal sum then follows from the general fact of PatternReciprocals. As proved, differs from the plan: no arrow from LinearForms is drawn (the pattern is written directly in the encoding of BadWheels, which LinearForms shares)."
  improves: "SophieGermainWheel says where Sophie Germain primes can sit on the wheel; this node bounds how many there are and shows their reciprocals add up to a finite total."
