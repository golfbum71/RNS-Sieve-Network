  title: the Sophie Germain primes' reciprocals add up to a finite total
  description: Primes p with 2p + 1 also prime number at most a constant times N over log N squared, so
    the sum of their reciprocals is finite. The linear-forms case of PatternUpperBound, applied to the
    pair a number and twice it plus one.
