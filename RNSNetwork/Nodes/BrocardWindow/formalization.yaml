sources:
  - title: "Brocard's conjecture (Wikipedia)"
    type: "paper"
    url: "https://en.wikipedia.org/wiki/Brocard%27s_conjecture"
    relationship: "the open conjecture whose window this node describes; nothing here proves it"
  - title: "Fermat's factorization method (Wikipedia)"
    type: "paper"
    url: "https://en.wikipedia.org/wiki/Fermat%27s_factorization_method"
    relationship: "the difference-of-two-squares identity behind the mark formula"
  - title: "Legendre sieve (Wikipedia)"
    type: "paper"
    url: "https://en.wikipedia.org/wiki/Legendre_sieve"
    relationship: "counting each composite under its prime factors; the collision rule is one term of Legendre's formula"
  - title: "K. Ford, Sieve Methods Lecture Notes, Spring 2023"
    type: "paper"
    url: "https://mail.ford126.web.illinois.edu/sieve2023.pdf"
    relationship: "Lemma 3.8 (Buchstab's identity): the row rules are its factor-shape split in the window"
  - title: "R. C. Baker, G. Harman, J. Pintz, The difference between consecutive primes, II"
    type: "paper"
    url: "https://doi.org/10.1112/plms/83.3.532"
    relationship: "the best published result on primes in short windows; it stops short of a Brocard window"

