node:
  id: BrocardWindow.v1
  family: BrocardWindow
  version: v1
  order: 103
  kind: paper
  status: active
  title: "where every wheel's marks fall between two prime squares"
  improves: >-
    GapConjectures states Brocard's conjecture and docs/BROCARD_NOTES.md
    describes the window in words; this node gives the exact position of
    every mark a wheel makes in the window, the exact rule for two wheels
    sharing a slot, and the row rules behind the small, middle and large
    wheel kinds, as checked statements. It proves nothing about how many
    primes the window holds.
  description: >-
    The window is the numbers strictly between a base prime's square and the
    next prime's square. A wheel at a given distance below the base prime
    marks the window at steps 1, 2, 3 and so on, and each mark is the square
    of the base prime plus the step, minus the square of the distance plus
    the step: a difference of two squares (Fermat's factorization identity).
    The mark is inside the window exactly when twice the step times the wheel
    lies between the distance squared and the distance squared plus the
    window length. Two different wheels share a slot only at a multiple of
    their product, with a remaining factor of at least 5, so two wheels whose
    product is at least a fifth of the next prime's square never share a
    slot. A wheel whose cube reaches the next prime's square makes a new mark
    only when its row is prime; one whose fourth power reaches it, only when
    its row is a prime or a product of two primes. These are Legendre's and
    Buchstab's bookkeeping in the window's own coordinates; the arrangement
    by distance and step is original to this project (Geoffrey Fischer,
    2026-11-14), the identities are classical.

