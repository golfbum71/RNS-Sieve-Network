node:
  id: VonKochBound.v1
  family: VonKochBound
  version: v1
  order: 112
  kind: paper
  status: active
  title: "the Riemann hypothesis as an error term, against the Brocard window"
  description: "Von Koch (1901): if the Riemann hypothesis holds, the number of primes up to x is within a constant times the square root of x times the logarithm of x of the logarithmic integral (cited; the Riemann hypothesis is the hypothesis, never claimed). The proved claim compares sizes: past e⁴, that error term is larger than four times the square root of x, which is the guaranteed Brocard window length (BrocardWindowLength) in the same units. It only compares two sizes. It does not show that the Riemann hypothesis fails to imply Brocard's conjecture; it shows that the von Koch error term alone is too coarse to settle it."
