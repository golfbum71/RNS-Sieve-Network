# Node metadata, following the shape of IEANTN's formalization.yaml.
# See docs/NODE_LIST.md for the plain-language list of all nodes.

node:
  id: HensleyRichards.v1
  family: HensleyRichards
  version: v1
  order: 15
  kind: paper
  status: active
  title: "Hardy and Littlewood's two conjectures clash"
  description: >-
    If an admissible pattern packs more offsets into a window than there are
    primes in a window of that length, Conjecture A (every admissible pattern
    repeats forever) and Conjecture B (prime counts are subadditive) cannot
    both hold.

conclusions:
  - id: HL_A_and_B_incompatible
    declaration: RNS.HensleyRichards.HL_A_and_B_incompatible
    summary: "Given a dense enough admissible pattern, Hardy-Littlewood Conjectures A and B cannot both hold."
    imports: []
    imports_status: none
    open_inputs: ["HL_conjecture_A", "HL_conjecture_B"]  # open conjectures: hypotheses of the claim, never claimed
    justifications:
      - id: lean-proof
        kind: lean-noncompliant
        solution: RNSSolutions/HensleyRichards.lean
        declaration: RNS.HensleyRichards.HL_A_and_B_incompatible_holds
        note: >-
          Complete Lean proof checked by `lake build RNSSolutions` (standard axioms only, 2026-11-04). Recorded as noncompliant only because no Comparator
          receipt exists yet.
    designated: lean-proof

sources:
