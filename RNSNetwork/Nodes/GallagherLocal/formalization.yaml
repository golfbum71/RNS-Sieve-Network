node:
  id: GallagherLocal.v1
  family: GallagherLocal
  version: v1
  order: 99
  kind: paper
  status: active
  title: one wheel's correction averages to 1
  description: For a single wheel, its correction factor for a pattern of k offsets (one minus the occupied
    positions over the wheel, divided by one minus one over the wheel to the k), averaged over all patterns
    of k distinct offsets up to h, tends to 1 as h grows. This is the one-wheel step of Gallagher's theorem,
    which GallagherAverage currently cites.
conclusions:
- id: one_wheel_average
  declaration: RNS.GallagherLocal.one_wheel_average
  summary: "For one prime wheel, the correction factor averaged over all sets of k offsets below h tends to 1 as h grows."
