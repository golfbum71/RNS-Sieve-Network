node:
  id: GallagherLocal.v1
  family: GallagherLocal
  version: v1
  order: 99
  kind: paper
  status: planned
  title: one wheel's correction averages to 1
  description: For a single wheel, its correction factor for a pattern of k offsets (one minus the occupied
    positions over the wheel, divided by one minus one over the wheel to the k), averaged over all patterns
    of k distinct offsets up to h, tends to 1 as h grows. This is the one-wheel step of Gallagher's theorem,
    which GallagherAverage currently cites.
conclusions: []
planned:
  source_status: New
  rests_on:
  - SingularSeries
  claims:
  - one_wheel_average
  tier: 'Tier 1-2: finite counting of how patterns fall on one wheel.'
  plan: Offsets up to h are nearly equidistributed modulo the wheel; the number of patterns occupying
    exactly r positions is a Stirling-number count, and the average of the factor is 1 up to O(1/h).
sources:
- title: K. Soundararajan, The distribution of prime numbers (lectures), arXiv:math/0606408
  url: https://arxiv.org/abs/math/0606408
