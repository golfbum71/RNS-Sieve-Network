sources:
  - title: "Hardy and Littlewood, Some problems of Partitio Numerorum III (Acta Math. 44, 1923)"
    url: https://doi.org/10.1007/BF02403921
    relationship: >-
      their Goldbach constant (singular series) is positive for every even
      number, the counting form of the fact that no finite set of wheels blocks
      a sum of two primes; the single-wheel and combined-cycle claims here state
      that fact without counting, in the stack picture
  - title: Goldbach's conjecture (Wikipedia)
    url: https://en.wikipedia.org/wiki/Goldbach%27s_conjecture
    relationship: states the conjecture whose equivalent forms this node proves; the stack and frontier forms are original

related:
  - node: Schnirelmann
    note: proves every number is a sum of boundedly many primes; this node restates the two-prime case as stacks
  - node: SelbergTwinRails
    note: bounds the Goldbach pairs of one number from above; here they are the pairs of stacks building one target
