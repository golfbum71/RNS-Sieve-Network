# Node metadata, following the shape of IEANTN's formalization.yaml.
# Added 2026-11-23 from Geo's stack picture of Goldbach's conjecture. See docs/NODE_LIST.md.

node:
  id: GoldbachStacks.v1
  family: GoldbachStacks
  group: gaps
  version: v1
  order: 128
  kind: paper
  status: active
  title: Goldbach's conjecture as a building problem with prime stacks
  description: >-
    Original to this project. Each odd prime is a stack two wide with one point
    sticking up (3 is height 1, 5 height 2, 7 height 3, 11 height 5). Two stacks
    put together make twice their total height plus 2, so building every pair of
    stacks reaches the target heights. Proved here: the stacks never leave a gap
    exactly when Goldbach's conjecture holds, and so does the frontier form (as
    the stacks arrive in order, every target up to a new stack's height is
    already built from the stacks before it). These are equivalences only;
    Goldbach's conjecture itself stays open. Also proved: at the wheel of size 3
    every stack above height 1 leaves remainder 0 or 2, never 1, and at any
    single wheel the surviving stacks, taken in pairs, reach every remainder,
    so no one wheel can force a gap. Resting on CRT, the same holds for the
    combined cycle of all the wheels below any bound at once: the good pairs
    chosen wheel by wheel join into one pair for the whole cycle. The open part
    is stated exactly as the window statement (window_no_gap, never claimed):
    every target is two heights, from 1 up to one less than the target, whose
    stacks survive every wheel up to the square root of twice the target plus 1.
    That range is far shorter than the combined cycle of those wheels, which is
    why the combined-cycle result does not reach it; the window statement is
    proved equivalent to the stack picture and to Goldbach's conjecture.

