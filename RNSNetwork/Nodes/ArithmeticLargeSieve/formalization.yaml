node:
  id: ArithmeticLargeSieve.v1
  family: ArithmeticLargeSieve
  version: v1
  order: 96
  kind: paper
  status: planned
  title: 'the large sieve: many blocked positions on every wheel'
  description: If every wheel p up to X blocks f(p) positions, the survivors in a window of length N number
    at most (square root of N plus X) squared over Q, where Q sums, over squarefree products of the wheels
    up to X, the product of f(p) over p minus f(p). Q is the same sum as Selberg's J. Montgomery's arithmetic
    large sieve, from the analytic large sieve inequality.
conclusions: []
