node:
  id: RandomRotation.v1
  family: RandomRotation
  version: v1
  order: 91
  kind: paper
  status: planned
  title: rotating every wheel at random
  description: 'Turn each wheel to a position chosen uniformly at random, independently. The chance that
    every member of a given finite set of positions survives equals the product over the wheels of one
    minus the number of distinct positions the set occupies on that wheel over the wheel size: exactly
    the pattern''s survivor share. By the Chinese Remainder Theorem each choice of rotations is a shift
    of the whole cycle, so this is a count of shifts. The random-sieve model of Banks, Ford and Tao and
    the starting point of the large-gap construction (Ford Lemma 8.4).'
conclusions: []
planned:
  source_status: New
  rests_on:
  - CRT
  - SurvivorCount
  claims:
  - rotation_is_shift
  - random_rotation_survival
  tier: 'Tier 1: finite, by CRT.'
  plan: 'rotation_is_shift: the map from shifts of the cycle to tuples of wheel rotations is a bijection
    (CRT). random_rotation_survival: count the shifts under which the set avoids every blocked position,
    wheel by wheel.'
sources:
