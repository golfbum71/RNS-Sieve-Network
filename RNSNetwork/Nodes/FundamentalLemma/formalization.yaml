node:
  id: FundamentalLemma.v1
  family: FundamentalLemma
  version: v1
  order: 84
  kind: paper
  status: planned
  title: the survivor count matches its share while the wheels stay small
  description: If the largest wheel is the level of distribution to the power one over a large number
    s, the survivors of any pattern equal the total times the survivor share, up to a relative error of
    e to minus s log s, plus remainders. This is why exact wheel shares predict counts for small wheels
    and fail at the square root. The fundamental lemma of sieve theory, Ford Theorem 3.6.
