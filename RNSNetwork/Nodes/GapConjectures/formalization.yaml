related:
- node: DudekJohnston
  note: "the proven near-prime version of Legendre's conjecture"
- node: KanoldBound
  note: "a proven survivor-gap bound of the kind these conjectures need, though far too weak to give them"
- node: BlockingRuns
  note: "the largest survivor gap, the quantity the named survivor bounds control"
- node: BrunPureSieve
  note: "the Brocard grid of wheels and slots, counted by its zeros, is Legendre's sieve; this node holds the alternating sum and its early-stopping inequalities (see docs/BROCARD_NOTES.md)"
- node: BuchstabIdentity
  note: "lone marks in the Brocard window are Buchstab's identity (leftover slots = primes + one-wheel labels + two-wheel labels)"
- node: AlmostPrimeWindow
  note: "the two-factor case of the split of leftover slots by factor shape (the split Harman's sieve uses)"
- node: ShieldCertificates
  note: "zero means prime below the next prime's square, the starting fact of the Brocard window picture"
