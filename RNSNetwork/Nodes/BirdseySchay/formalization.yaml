node:
  id: BirdseySchay.v1
  family: BirdseySchay
  version: v1
  order: 32
  kind: paper
  status: active
  title: the twin share carried below the ceiling
  improves: ShareAsymptotics gives the twin share of the whole cycle; this node shows that carrying it
    to the primes below the next prime's square with Birdsey and Schay's single Mertens correction,
    e to the Euler constant over 2, lands exactly on the Hardy-Littlewood count for twins.
  description: Birdsey and Schay's heuristic says the twin pairs below a prime's square are about e to
    the Euler constant over 2, times the twin share for the wheels up to that prime (the product of
    (wheel - 2)/(wheel - 1)), times the number of primes below the square. The heuristic is open and
    never claimed. Proved without it - the corrected share times the log tends to half the twin-prime
    constant, and neighbouring primes have ratio tending to 1. Proved from it - the twin count is the
    Hardy-Littlewood prediction at the prime squares and then at every bound, so the heuristic implies
    the Hardy-Littlewood conjecture for twins. Numerically, below the square of 9973 there are 438,192
    twin pairs against the heuristic's 410,353 (ratio 1.068).
