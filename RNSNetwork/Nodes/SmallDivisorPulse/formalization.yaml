node:
  id: SmallDivisorPulse.v1
  family: SmallDivisorPulse
  version: v1
  order: 119
  kind: paper
  status: active
  group: lonely
  title: every small number divides a speed of any counterexample
  description: Normalize so the runner to be lonely stands still and the others have whole-number speeds.
    If no speed is divisible by some number from 2 up to the field size, then at the time one over that
    number every moving runner is at least one over that number from the start, which is enough. So in
    any set of speeds that is never lonely, every number from 2 up to the field size divides some speed,
    and their least common multiple divides the product of the speeds. Rosenfeld 2025, Lemma 4. The general
    form of the even/odd pulse.
