node:
  id: SophieGermainTheorem.v1
  family: SophieGermainTheorem
  version: v1
  order: 55
  kind: paper
  status: active
  title: the first case of Fermat's Last Theorem for Sophie Germain primes
  description: For a prime p with 2p+1 prime, any integer solution of x^p + y^p + z^p = 0 has p dividing
    x y z; so for odd p, x^p + y^p = z^p has no solution with p dividing none of x, y, z. The proof runs
    on the wheel of size 2p+1, using SophieGermainPowers twice.
