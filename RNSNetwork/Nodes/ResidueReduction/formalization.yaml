# Lonely Runner family, built 2026-11-23. See docs/NODE_LIST.md.

node:
  id: ResidueReduction.v1
  family: ResidueReduction
  version: v1
  order: 121
  kind: paper
  status: active
  group: lonely
  title: 'only the remainders matter: a residue sieve for the lonely runner'
  description: 'Pick a wheel and a modulus equal to the number of runners times that wheel. At times that
    are fractions of that modulus, a speed and that speed plus the modulus look the same, so only the
    speeds'' remainders matter (far_mod). The residue check: every list of remainders, as many as the
    moving runners, none a multiple of the wheel, and with every list-but-one sharing no factor with the
    modulus, has a lonely time with that denominator. If the check passes, every set of speeds with no
    common factor that is never lonely has a speed divisible by the wheel (residue_check_forces_divisor).
    Lists failing the sharing condition are handled by TeamShift, given the conjecture for one runner
    fewer, which is a named hypothesis inside the claim. Rosenfeld 2025, Lemma 6, the main lemma of the
    record proofs. Checked numerically (not in Lean): for four runners the check passes for the wheels
    2, 3, 7, 11 and 13 and fails for 5; for five runners it passes for 5. As proved, differs from the
    plan: the fully checked four- and five-runner cases (small_field_checks) and Rosenfeld''s Corollary
    3 size bound are not done and stay planned; times are fractions, as in PileUpLock.'
