node:
  id: ColumnAction.v1
  family: ColumnAction
  version: v1
  order: 25
  kind: paper
  status: active
  title: how a wheel moves the columns
  description: Multiplying by a prime keeps the 6n-1 and 6n+1 columns in place if the prime leaves
    remainder 1 on division by 6, and swaps them if it leaves remainder 5. The lemma behind every
    column form in the network. Proved directly from remainders; ColumnStructure's columns_multiply
    says the same for column entries.
conclusions:
- id: column_action
  declaration: RNS.ColumnAction.column_action
  summary: Multiplying by a number leaving remainder 1 on division by 6 keeps the column; by one
    leaving remainder 5, swaps the 6n+1 and 6n-1 columns.
  imports: []
  imports_status: none
  justifications:
