node:
  id: MertensSecond.v1
  family: MertensSecond
  version: v1
  order: 68
  kind: paper
  status: active
  improves: Supplies the upper bound on the sum of prime reciprocals that Brun's choice of stopping point
    needs.
  title: the sum of the reciprocals of the primes (Mertens' second theorem)
  description: The sum of one over each prime up to x is log log x plus a constant plus a remainder at most
    a constant over log x (outside claim, from PNT+); so it is at most log log x plus a constant.
conclusions:
