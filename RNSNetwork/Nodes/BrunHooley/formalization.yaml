node:
  id: BrunHooley.v1
  family: BrunHooley
  version: v1
  order: 74
  kind: paper
  status: planned
  title: Hooley's product of truncated sieves
  description: Split the wheels into ranges and stop inclusion-exclusion separately in each range, early
    for large wheels and late for small ones; the product of these upper sieves is again an upper sieve.
    This gives an upper bound of the right order for any pattern and any number of wheels, needing only
    that each wheel's share is about the pattern size over the wheel on average. The Brun-Hooley sieve,
    Ford Sections 2 and 3.
  improves: BrunPureSieve stops once for all wheels and loses a log log factor; stopping per range removes
    the loss.
conclusions: []
planned:
  source_status: New
  rests_on:
  - BrunPureSieve
  - BrunTruncation
  claims:
  - product_upper_sieve
  - brun_hooley_bound
  - brun_hooley_order
  tier: 'product_upper_sieve: Tier 1, finite combinatorics. brun_hooley_bound and brun_hooley_order: Tier
    2.'
  plan: 'Session 1: the product of upper sieves over a partition of the wheels is an upper sieve (Lemma
    2.1). Session 2: the bound by X V e^E plus remainders (Theorem 2.3), from BrunTruncation in each range.
    Session 3: the ranges z^(1/4^j) with stopping points 2^(j-1) (Theorem 2.4).'
