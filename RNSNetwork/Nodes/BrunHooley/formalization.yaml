node:
  id: BrunHooley.v1
  family: BrunHooley
  version: v1
  order: 74
  kind: paper
  status: active
  title: Hooley's product of truncated sieves
  improves: "BrunPureSieve stops inclusion-exclusion at one point for all wheels; this node lets each range of wheels have its own sieve and shows that the product is still an upper sieve."
  description: "Split the wheels into ranges and stop inclusion-exclusion separately in each range, early for large wheels and late for small ones; the product of these upper sieves is again an upper sieve. This gives an upper bound of the right order for any pattern and any number of wheels, needing only that each wheel's share is about the pattern size over the wheel on average. The Brun-Hooley sieve, Ford Sections 2 and 3. As proved, differs from the plan: only the first step, Ford's Lemma 2.1, is proved: the product of upper sieves over ranges of wheels is an upper sieve, with its expansion as a sum over one choice of a set of wheels from each range. It holds for any wheels (not only primes) and ranges that need not be disjoint, and does not use BrunPureSieve or BrunTruncation, so those arrows wait for the bounds. The bounds (Ford's Theorem 2.3, the survivors at most the length times the share times e to a small error, plus remainders; and Theorem 2.4, the ranges z^(1/4^j) with stopping points 2^(j-1)) are not proved and stay planned."
  improves: BrunPureSieve stops once for all wheels and loses a log log factor; stopping per range removes
    the loss.
