planned:
  source_status: New
  rests_on:
  - MertensSecond
  claims:
  - brun_hooley_ford
  tier: 'Tier 2: real-power ranges and Ford''s kappa, B hypothesis.'
  plan: 'Ford Theorem 2.4 proper: ranges (z^(1/4^j), z^(1/4^(j-1))] with stopping points 0 for the top range
    and 2^(j-1) below, so every choice has product at most z (choice_product_le); Ford''s hypothesis prod
    over y <= p <= w of (1 - g p)^(-1) <= (log w / log y)^kappa e^(B / log y) gives each range L = kappa
    log 4 + 4B / log 2 and v = 4^(-kappa) e^(-4B / log 2); then brun_hooley_order gives survivors <= C(kappa,
    B) X V(z) plus remainders over squarefree d <= z.'
