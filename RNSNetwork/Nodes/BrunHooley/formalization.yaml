node:
  id: BrunHooley.v1
  family: BrunHooley
  version: v1
  order: 74
  kind: paper
  status: active
  title: Hooley's product of truncated sieves
  improves: "BrunPureSieve stops inclusion-exclusion at one point for all wheels; this node lets each range of wheels have its own sieve and shows that the product is still an upper sieve."
  description: "Split the wheels into ranges and stop inclusion-exclusion separately in each range, early for large wheels and late for small ones; the product of these upper sieves is again an upper sieve. This gives an upper bound of the right order for any pattern and any number of wheels, needing only that each wheel's share is about the pattern size over the wheel on average. The Brun-Hooley sieve, Ford Sections 2 and 3. As proved, differs from the plan: proved are Ford's Lemma 2.1 (the product of upper sieves is an upper sieve, with its expansion) and Theorem 2.3 in two forms: survivors at most X times the product over the ranges of (one minus the shares, multiplied out, plus the total share to the power b+1 over (b+1)!), plus the remainders of the choices of at most b wheels per range; and the same with e to the sum of each range's error over its product. Sifting is of the values of a finite set of positions, so patterns fit directly. Of Theorem 2.4 the general step is proved (brun_hooley_order): distinct even stopping points with every range's total share at most L and product at least v give the factor e^(e^L / v), whatever the number of ranges; and choice_product_le bounds the product of a choice by the product of y_i^(b_i). Still planned: the concrete ranges z^(1/4^j) with stopping points 2^(j-1) under Ford's kappa, B hypothesis (brun_hooley_ford). The remainders are stated per choice of wheels from each range, not per squarefree modulus; for disjoint ranges these agree."
  improves: BrunPureSieve stops once for all wheels and loses a log log factor; stopping per range removes
    the loss.
