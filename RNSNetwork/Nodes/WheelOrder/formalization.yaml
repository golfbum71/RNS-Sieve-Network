    declaration: RNS.WheelOrder.wheel_marginal_new_formula
    summary: "The positions a wheel blocks first equal the open positions of the earlier wheels times the sizes of the later ones."
    imports: []
    imports_status: none
    justifications:
      - id: lean-proof
