# Node metadata, following the shape of IEANTN's formalization.yaml.
# See docs/NODE_LIST.md for the plain-language list of all nodes.

node:
  id: WheelOrder.v1
  family: WheelOrder
  version: v1
  order: 9
  kind: paper
  status: active
  title: "what each wheel adds when wheels arrive in order"
  description: >-
    Bringing wheels in one at a time, the positions a wheel blocks for the
    first time equal the open positions left by every earlier wheel times the
    full size of every later wheel. Separately, from any 6n±1 position, the
    next number with a chosen last digit is reached in the raw digit distance
    or at most one further step of 10.

conclusions:
