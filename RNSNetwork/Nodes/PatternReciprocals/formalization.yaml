  title: reciprocal sums converge for every pattern of two or more
  description: For every admissible pattern with at least two members, the sum of one over the first member,
    over all positions where every member is prime, is finite. Brun's theorem for twins is the case of
    the pattern 0, 2; triples such as 0, 2, 6 and pairs at any gap follow the same way.
  improves: BrunTheorem covers twins only.
