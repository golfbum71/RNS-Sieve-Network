# Scoped 2026-11-08 from Ford's Spring 2023 sieve notes, Ch. 1-4; built 2026-11-15 on GapPairs. See docs/NODE_LIST.md.

node:
  id: PatternReciprocals.v1
  family: PatternReciprocals
  version: v1
  order: 77
  kind: paper
  status: active
  title: reciprocal sums converge for every pattern of two or more
  description: "For every pattern of two or more offsets, the reciprocals of the positions where the position plus every offset is prime add up to a finite total. Brun's theorem for twins is the case of the pattern 0, 2; triples such as 0, 2, 6, quadruples such as 0, 2, 6, 8 and pairs at any gap are covered too. The node first proves a general fact: if the positions with some property, up to any point past a start, number at most a constant times that point over the square of its logarithm, then their reciprocals add up to a finite total (the stretch from one power of 2 to the next adds at most a constant over the square of the exponent). A position fitting a pattern with two different offsets puts a prime pair at the gap between them, so GapPairs gives the count. As proved, differs from the plan: the node rests on GapPairs, not on PatternUpperBound, since the pair bound already has the square of the logarithm that convergence needs; and the pattern need not be admissible (an inadmissible pattern has only finitely many positions, and the statement holds for it too)."
  improves: "BrunTheorem covers twins only, from BrunAnalytic's bound with the logarithm to the power 3/2. This node covers every pattern of two or more, and its general fact can be reused for any count bound of the same shape (GermainReciprocals uses it)."
