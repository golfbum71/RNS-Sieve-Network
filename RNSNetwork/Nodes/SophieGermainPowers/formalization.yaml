  order: 54
  kind: paper
  status: active
  title: on the wheel of size 2p+1, p-th powers have three positions
  description: For a Sophie Germain prime p, every p-th power sits at position 0, 1 or -1 on the wheel of
    size 2p+1 (Fermat's little theorem). So if the wheel blocks a sum of three p-th powers, it blocks one
    of the three numbers. The two wheel facts behind Sophie Germain's theorem.
