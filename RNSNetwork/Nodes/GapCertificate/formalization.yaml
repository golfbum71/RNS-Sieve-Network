node:
  id: GapCertificate.v1
  family: GapCertificate
  version: v1
  order: 29
  kind: paper
  status: active
  title: the Lacampagne-Selfridge counterexample
  description: For the wheels up to 13 (cycle 30030), the gaps between consecutive survivors take every
    even value up to the largest gap, 22, except 20. This refutes de Polignac's 1849 guess (every even
    gap up to twice the second-largest wheel occurs) and Erdős's first guess for this cycle (every even
    value up to the largest gap occurs; Erdős Problem 854). Erdős asked for large enough cycles, so that
    eventual form stays open. Every survivor gap is even.
conclusions:
- id: survivor_gaps_even
  declaration: RNS.GapCertificate.survivor_gaps_even
  summary: Once the wheel 2 is in, every gap between consecutive survivors is even.
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/GapCertificate.lean
    declaration: RNS.GapCertificate.survivor_gaps_even_holds
    note: Complete Lean proof checked by `lake build RNSSolutions` (standard axioms only, 2026-11-05). Recorded as noncompliant only because no Comparator receipt exists yet.
  designated: lean-proof
- id: survivor_gaps_30030_miss_20
