node:
  id: LehmerSplit.v1
  family: LehmerSplit
  version: v1
  order: 22
  kind: paper
  status: active
  title: Lehmer's even split
  description: If one wheel leaves remainder 1 on division by a chosen number of intervals,
    the survivors of the cycle split evenly across that many equal intervals (endpoints rounded
    down). With wheels 2 and 3 frozen, each column splits evenly when a wheel leaves remainder
    1 on division by the least common multiple of 6 and the number of intervals. UniformSubdivision's
    whole-count claim is the case of the rotating prime minus one intervals.
