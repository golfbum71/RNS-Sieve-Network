  - lehmer_even_split_column
  evidence: Both checked numerically on 4,761 cases (wheel sets from the primes up to 19,
    up to 24 intervals).
  tier: 'Tier 1: elementary.'
sources:
- title: D. H. Lehmer, The distribution of totatives, Canad. J. Math. 7 (1955), 347-357
