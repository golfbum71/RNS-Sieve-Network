node:
  id: PrimeGapsBridge.v1
  family: PrimeGapsBridge
  version: v1
  order: 50
  kind: paper
  status: active
  title: the network's admissibility is PrimeGapsLib's
  description: The network's admissibility (fewer occupied positions than the wheel size, at every wheel)
    is the same as PrimeGapsLib's (some residue class missed, at every prime). So PrimeGapsLib's Lean
    results on admissible sets, including infinitely many prime gaps of at most 246 assuming
    Bombieri-Vinogradov, apply to the network's admissible patterns unchanged.
conclusions:
- id: admissible_iff_primegaps
  declaration: RNS.PrimeGapsBridge.admissible_iff_primegaps
  summary: An offset pattern is admissible in the network's sense exactly when it is admissible in
    PrimeGapsLib's sense.
  imports: []
  imports_status: none
