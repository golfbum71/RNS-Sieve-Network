# Node metadata, following the shape of IEANTN's formalization.yaml.
# Scoped 2026-11-08 from Ford's notes Ch. 5-9 and other lecture notes; built 2026-11-14 on SelbergTwinRails. See docs/NODE_LIST.md.

node:
  id: Schnirelmann.v1
  family: Schnirelmann
  version: v1
  order: 97
  kind: paper
  status: active
  title: every number is a sum of boundedly many primes
  improves: >-
    SelbergTwinRails bounds the Goldbach pairs of one number. This node adds
    that bound up over all numbers and turns it into a statement about every
    number: a fixed number of primes is enough to reach each one.
  description: >-
    There is a number c such that every number from 2 on is a sum of at most
    c primes (Schnirelmann 1930). The wheels enter through one input: Selberg's
    upper bound for the Goldbach pairs of a number, which carries a factor
    for the wheels from 5 up that divide the number. That factor does not pile
    up on average: its square, added over the numbers up to N, is at most a
    constant times N. So the squares of the Goldbach pair counts up to N total
    at most a constant times N cubed over the fourth power of log N, while the
    counts themselves total at least the square of the number of primes up to
    half of N. By the Cauchy-Schwarz inequality and Chebyshev's lower bound
    for the number of primes, a positive share of numbers are sums of two
    primes. Schnirelmann's inequality (the density of a sumset is at least the
    sum of the densities minus their product) and his basis theorem then give
    a fixed number of summands. As proved, differs from the plan. The node
    rests on SelbergTwinRails, not on GapPairs: the factor of SelbergTwinRails
    is the one averaged, which avoids the totient. The constant c is not made
    explicit (it comes from an existence statement). Chebyshev's bound is
    taken from Mathlib. Schnirelmann's inequality and basis theorem are proved
    here because Mathlib has the density and the case of total density at
    least one but not the inequality.

