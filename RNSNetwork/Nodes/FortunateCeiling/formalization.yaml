node:
  id: FortunateCeiling.v1
  family: FortunateCeiling
  version: v1
  order: 59
  kind: paper
  status: active
  improves: ShieldCertificates gives the window (from a cutoff up to its square, prime means no wheel
    divides); this node shows that every number which, added to the cycle, lands on a prime is
    already wheel-free, so the window applies to it. That settles the RNS half of two open statements
    in DeepMind's formal-conjectures (Fortune's conjecture and OEIS A038771).
  title: what lands on a prime just above the cycle (Fortune's conjecture, OEIS A038771)
  description: Add a number above 1 to the combined cycle of the wheels. If the sum is prime, no wheel
    divides the number added, so it is prime below the next prime's square, a composite one is at
    least that square, and below the next prime's cube a composite one has exactly two prime factors.
    Applied to the Fortunate numbers this proves each is at least the next prime and prime below the
    ceiling, so Fortune's conjecture follows from the ceiling bound; applied to OEIS A038771 it proves
    the ceiling floor for every wheel count and Kamenetsky's two-factor conjecture below the cube.
