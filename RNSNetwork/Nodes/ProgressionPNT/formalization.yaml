node:
  id: ProgressionPNT.v1
  family: ProgressionPNT
  version: v1
  order: 114
  kind: paper
  status: planned
  group: distribution
  title: "every width shares its primes equally among its survivor columns"
  description: "Lay the numbers out in rows of any fixed width. Only the survivor columns (offsets sharing no factor with the width) hold more than one prime, and as the rows go on each survivor column's share of the primes tends to one over the number of survivor columns. This is the prime number theorem for arithmetic progressions (de la Vallée Poussin, 1896); the two columns 6n-1 and 6n+1 are the width-6 case. It says nothing about how far down the rows one must go, which is what the Elliott-Halberstam family below is about. Mathlib has only the infinitely-many form (DirichletColumns); the equal-share form is being finished in PrimeNumberTheoremAnd, so this enters as an outside claim once that proof exists."
