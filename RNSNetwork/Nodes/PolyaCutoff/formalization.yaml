node:
  id: PolyaCutoff.v1
  family: PolyaCutoff
  version: v1
  order: 72
  kind: paper
  status: active
  title: sifting to Polya's cutoff gives the Hardy-Littlewood constant exactly
  description: "If the wheels run only up to the power one over e to Euler's constant (about 0.56) of the range, the share of the cycle surviving an admissible pattern, times the logarithm of the range to the number of offsets, tends to the pattern's Hardy-Littlewood constant. So the conjectured constant comes out of the wheels alone, with no correction. For a single offset this matches the prime number theorem, in contrast to CeilingOvershoot, where wheels up to the square root overshoot by twice e to minus Euler's constant. Pólya's observation, made rigorous by Banks, Ford and Tao. As proved: matches the plan, for every nonempty admissible pattern, with the wheels up to the integer part of x to the power e to minus Euler's constant; joined to the PNT+ outside claim for Mertens' third theorem in Assemble."
  improves: ShareAsymptotics leaves a factor e to minus Euler's constant per offset; at this cutoff it
    disappears.
conclusions:
- id: polya_cutoff_share
  declaration: RNS.PolyaCutoff.polya_cutoff_share
  summary: "With the wheels up to x to the power e to minus Euler's constant, the survivor share of an admissible pattern times (log x) to the number of offsets tends to its Hardy-Littlewood constant."
  imports:
