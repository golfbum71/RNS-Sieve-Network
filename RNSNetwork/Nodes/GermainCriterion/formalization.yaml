  designated: lean-proof
sources:
- title: J. Germain, The distribution of totatives, Canad. Math. Bull. 48 (2005), 211-220
  url: https://doi.org/10.4153/CMB-2005-019-9
  relationship: Theorem 1.1 and Corollary 1.4; this node proves the "if" half of Corollary 1.4
- title: R. R. Hall and P. Shiu, The distribution of totatives, Canad. Math. Bull. 45 (2002), 109-114
  url: https://doi.org/10.4153/CMB-2002-012-1
  relationship: proves Erdős's conjecture (the "only if" half of Corollary 1.4); its ordering-of-residues
    theorem is false as stated for composite moduli (smallest case 8 parts with residues 1, 3, 5), though
    the triples its reduction produces were all fine in 8,012 checked cases
related:
- node: LehmerSplit
  note: "the case where one wheel leaves remainder 1, for any number of wheels; this node's first case is its two-wheel instance, reproved here from Sawtooth"
- node: SurvivorSymmetry
  note: "the mirror symmetry of the survivors; the second sufficient case is a mirror-type cancellation in the remainders"
