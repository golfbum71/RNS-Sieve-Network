  designated: lean-proof
- id: odd_primitive_weighted_sum_ne_zero
  declaration: RNS.GermainCriterion.odd_primitive_weighted_sum_ne_zero
  summary: For an odd primitive Dirichlet character, the sum of each residue of the cycle weighted by
    the character is not zero.
  imports:
  - HurwitzZetaZero.v1.hurwitz_zeta_at_zero
  imports_status: identified
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/GermainCriterion.lean
    declaration: RNS.GermainCriterion.odd_primitive_weighted_sum_ne_zero_step
    note: Lean proof of the step from the cited Hurwitz zeta value, taken as a named hypothesis, and
      the previous claim. Built clean 2026-11-05 (standard axioms only); it stays a step, not assembled,
      until HurwitzZetaZero is proved in Lean.
  designated: lean-proof
- id: character_transform
  declaration: RNS.GermainCriterion.character_transform
  summary: Weighting Sawtooth's signed remainder sum by a conjugate Dirichlet character and adding over
    all residues gives the product over the wheels of (character at the wheel minus 1), times the
    character-weighted residue sum (Germain's (3.1), in remainder form).
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/GermainCriterion.lean
    declaration: RNS.GermainCriterion.character_transform_holds
    note: Complete Lean proof checked by `lake build RNSSolutions` (standard axioms only, 2026-11-05),
      after a numerical check for every character of 7, 8, 9, 12, 15, 16, 20 and 21 parts. Recorded
      as noncompliant only because no Comparator receipt exists yet.
  designated: lean-proof
- id: weighted_sum_eq_LFunction_zero
  declaration: RNS.GermainCriterion.weighted_sum_eq_LFunction_zero
  summary: For a nontrivial Dirichlet character of modulus N other than 1, the character-weighted
    residue sum equals minus N times the L-function at 0.
  imports:
  - HurwitzZetaZero.v1.hurwitz_zeta_at_zero
  imports_status: identified
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/GermainCriterion.lean
    declaration: RNS.GermainCriterion.weighted_sum_eq_LFunction_zero_step
    note: Lean proof of the step from the cited Hurwitz zeta value, taken as a named hypothesis. Built
      clean 2026-11-05 (standard axioms only); a step until HurwitzZetaZero is proved in Lean.
  designated: lean-proof
- id: odd_weighted_sum_ne_zero_iff
  declaration: RNS.GermainCriterion.odd_weighted_sum_ne_zero_iff
  summary: For any odd Dirichlet character, primitive or not, the character-weighted residue sum is
    nonzero exactly when the primitive character behind it differs from 1 at every prime of the
    modulus (Germain's (3.2)).
  imports:
  - HurwitzZetaZero.v1.hurwitz_zeta_at_zero
  imports_status: identified
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/GermainCriterion.lean
    declaration: RNS.GermainCriterion.odd_weighted_sum_ne_zero_iff_step
    note: Lean proof through Mathlib's LFunction_changeLevel at s = 0, built clean 2026-11-05
      (standard axioms only); a step until HurwitzZetaZero is proved in Lean. The underlying
      identity was checked numerically for 76 odd characters across 17 moduli.
  designated: lean-proof
- id: coprime_split_iff_characters
  declaration: RNS.GermainCriterion.coprime_split_iff_characters
  summary: For prime wheels not dividing k, Sawtooth's signed remainder sum vanishes at every residue
    coprime to k exactly when every odd character mod k equals 1 at a wheel, or has its inverse's
    primitive character equal to 1 at a prime of k (Germain's Proposition 3.1).
  imports:
  - HurwitzZetaZero.v1.hurwitz_zeta_at_zero
  imports_status: identified
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/GermainCriterion.lean
    declaration: RNS.GermainCriterion.coprime_split_iff_characters_step
    note: Lean proof by Mathlib's character orthogonality, built clean 2026-11-05 (standard axioms
      only); a step until HurwitzZetaZero is proved in Lean. Checked numerically first in 1,827 cases (moduli 2 to 30, up to
      three wheels), 500 of them even splits.
  designated: lean-proof
- id: all_residues_split_iff_wheels
  declaration: RNS.GermainCriterion.all_residues_split_iff_wheels
  summary: For prime wheels not dividing k, Sawtooth's signed remainder sum vanishes at every starting
    residue exactly when every odd character mod k equals 1 at some wheel (Germain's Corollary 3.2).
  imports:
  - HurwitzZetaZero.v1.hurwitz_zeta_at_zero
  imports_status: identified
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/GermainCriterion.lean
    declaration: RNS.GermainCriterion.all_residues_split_iff_wheels_step
    note: Lean proof from Proposition 3.1 by dividing out the common factor of the residue and k, and
      by passing to the conductor; built clean 2026-11-05 (standard axioms only), a step until
      HurwitzZetaZero is proved in Lean. Checked numerically
      first in 1,827 cases (moduli 2 to 30, up to three wheels), 479 of them even splits at every
      residue.
  designated: lean-proof
- id: split_add_wheel
  declaration: RNS.GermainCriterion.split_add_wheel
  summary: If the survivors of the wheels split evenly into k parts, so do the survivors with one more wheel added (Germain's Proposition 2.1 (c)), in remainder form.
  imports: []
  imports_status: identified
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/GermainCriterion.lean
    declaration: RNS.GermainCriterion.split_add_wheel_holds
    note: Lean proof built clean 2026-11-05 (standard axioms only). Checked numerically first (wheels up to 17, up to 30 parts). 2,240 cases.
  designated: lean-proof
- id: split_fewer_parts
  declaration: RNS.GermainCriterion.split_fewer_parts
  summary: An even split into k parts gives an even split into h parts for every h dividing k (Germain's Proposition 2.1 (d)), in remainder form.
  imports: []
  imports_status: identified
  justifications:
