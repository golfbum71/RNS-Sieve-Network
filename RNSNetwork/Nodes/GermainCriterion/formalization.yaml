  designated: lean-proof
- id: split_remove_dividing_wheel
  declaration: RNS.GermainCriterion.split_remove_dividing_wheel
  summary: For prime wheels, removing a wheel that divides the number of parts keeps an even split, provided a wheel remains (Germain's Proposition 2.1 (e)), in remainder form.
  imports: []
  imports_status: identified
  justifications:
