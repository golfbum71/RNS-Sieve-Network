  declaration: RNS.GermainCriterion.two_wheel_split_of_remainders
  summary: For two prime wheels, the survivors split evenly into k equal parts when one wheel leaves
    remainder 1 on division by k, or the first wheel's square leaves remainder 1 and the two wheels
    add up to a multiple of k.
  imports:
  - Sawtooth.v1.even_split_iff_remainders_cancel
  imports_status: identified
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/GermainCriterion.lean
    declaration: RNS.GermainCriterion.two_wheel_split_of_remainders_step
    assembled: RNSSolutions/Assemble.lean (RNS.GermainCriterion.two_wheel_split_of_remainders_holds)
    note: Lean proof of the step from the imported claim, taken as a named hypothesis; the proof
      file imports claims only, never proofs. Built clean 2026-11-05 (standard axioms only). Recorded
      as noncompliant only because no Comparator receipt exists yet.
  designated: lean-proof
- id: odd_primitive_LFunction_zero_ne_zero
  declaration: RNS.GermainCriterion.odd_primitive_LFunction_zero_ne_zero
  summary: For an odd primitive Dirichlet character, the L-function does not vanish at 0 (from
    Mathlib's functional equation and the nonvanishing at 1).
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/GermainCriterion.lean
    declaration: RNS.GermainCriterion.odd_primitive_LFunction_zero_ne_zero_holds
    note: Complete Lean proof from Mathlib alone, checked by `lake build RNSSolutions` (standard axioms
