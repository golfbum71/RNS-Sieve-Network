  designated: lean-proof
- id: weighted_sum_eq_LFunction_zero
  declaration: RNS.GermainCriterion.weighted_sum_eq_LFunction_zero
  summary: For a nontrivial Dirichlet character of modulus N other than 1, the character-weighted
    residue sum equals minus N times the L-function at 0.
  imports:
