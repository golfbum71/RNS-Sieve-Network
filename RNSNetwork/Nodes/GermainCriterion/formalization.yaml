- id: odd_weighted_sum_ne_zero_iff
  declaration: RNS.GermainCriterion.odd_weighted_sum_ne_zero_iff
  summary: For any odd Dirichlet character, primitive or not, the character-weighted residue sum is
    nonzero exactly when the primitive character behind it differs from 1 at every prime of the
    modulus (Germain's (3.2)).
  imports:
  - HurwitzZetaZero.v1.hurwitz_zeta_at_zero
  imports_status: identified
  justifications:
  - id: lean-proof
