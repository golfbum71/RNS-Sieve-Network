- id: two_parts_exception
  declaration: RNS.GermainCriterion.two_parts_exception
  summary: The single wheel 2 does not split evenly into 2 parts although no odd character modulo 2 exists, so Germain's Theorem 1.1 as printed fails for 2 parts with every wheel dividing 2.
  imports: []
  imports_status: identified
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/GermainCriterion.lean
    declaration: RNS.GermainCriterion.two_parts_exception_holds
