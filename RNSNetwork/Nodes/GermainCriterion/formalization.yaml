node:
  id: GermainCriterion.v1
  family: GermainCriterion
  version: v1
  order: 35
  kind: paper
  status: active
  title: Germain's exact criterion for an even split
  description: Cut the cycle of two prime wheels into a given number of equal parts. The survivors split
    evenly exactly when one wheel leaves remainder 1 on division by the number of parts, or the first
    wheel's square leaves remainder 1 and the second wheel is the negative of the first (Germain 2005,
    Corollary 1.4). Built so far, the "if" half, by remainder arithmetic alone; the analytic input, that an odd
    primitive character's weighted residue sum is never zero; and the character transform of the
    remainder sum (Germain's (3.1)). Next stage, the "only if"
    half, which is Erdős's conjecture on Lehmer's even split, through odd Dirichlet characters and
    the nonvanishing of their L-functions at 1 (Mathlib's LFunction_apply_one_ne_zero).
  improves: LehmerSplit gives an even split when one wheel leaves remainder 1, for any number of
    wheels. For two wheels this node adds the second sufficient case (the second wheel the negative of
    the first, with the first wheel's square leaving remainder 1), which LehmerSplit does not cover.
conclusions:
