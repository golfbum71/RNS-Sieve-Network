node:
  id: KanoldBound.v1
  family: KanoldBound
  version: v1
  order: 46
  kind: paper
  status: active
  title: every stretch of 2^k numbers holds a survivor of k wheels
  description: "For any k prime wheels, every stretch of two to the k consecutive numbers contains a survivor; so the largest survivor gap is at most two to the number of wheels. Kanold's explicit bound on Jacobsthal's function, cited. Weaker than JacobsthalQuadratic for many wheels, but with no hidden constant, so it can be evaluated for any concrete set of frozen wheels. Kanold's proof splits into cases by the size of the wheels and uses Rosser's explicit prime estimates for the large ones; its one wheel-native step is proved here: a progression whose step no wheel divides behaves like a stretch of consecutive numbers, and adding a prime wheel to a set whose survivors come at least once in every stretch of a given length makes them come at least once in every stretch of the new wheel times (that length minus 1), plus 2."
  improves: "Adds the proved add-a-wheel step (Kanold's Lemma 4, prime case) beside the cited bound; with the wheel 2 it says adding 2 to odd wheels at most doubles the largest survivor gap plus one."
conclusions:
