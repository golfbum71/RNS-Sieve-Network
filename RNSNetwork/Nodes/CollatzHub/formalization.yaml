sources:
  - title: Collatz conjecture (Wikipedia)
    url: https://en.wikipedia.org/wiki/Collatz_conjecture
    relationship: states the conjecture this node restates in hub form; the hub picture, the three loops and exit pairing are original
  - title: "Lagarias, The 3x+1 problem: an overview (2021)"
    url: https://arxiv.org/abs/2111.02635
    relationship: >-
      survey of the standard tools this node's structure matches (accelerated
      maps, residue classes, inverse trees); the fair-block identity is the
      exact form of the average-ratio-one fact used there
  - title: "Lagarias and Weiss, The 3x+1 problem: two stochastic models (Ann. Appl. Probab. 1992)"
    url: https://doi.org/10.1214/aoap/1177005779
    relationship: models the backward tree modulo powers of 3; the ladder cycle and pairing_is_ladder are exact facts about that tree

