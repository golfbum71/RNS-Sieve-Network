node:
  id: CollatzHub.v1
  family: CollatzHub
  group: foundations
  version: v1
  order: 129
  kind: paper
  status: active
  title: the Collatz map seen from the 6n-2 hub
  description: >-
    Original to this project (Geo's hub picture of the Collatz 3x+1 map on the
    6n±1 columns). Every odd Collatz step lands on a number 6n-2, the hub; from
    the hub the map takes one of three loops back to the hub, chosen by the
    index n (the bad loop through the 6n-1 column when n is even, the loop
    through 6n+2 and 6n+1 when n leaves remainder 1 on division by 4, the loop
    through 6n+2 straight back when it leaves remainder 3), so the Collatz map
    becomes a map on the index. Proved here, for every index: the three loops
    are the Collatz map; a run of bad loops from 2^k·m ends at 3^k·m; exit
    pairing (the runs from 2^(k+1)·m and 2^k·m meet one loop after they end
    whenever 3^k·m leaves remainder 1 on division by 4); the three backward
    links (ladder, run entry, branch entry) are the only ways into a value, the
    ladder is times 4 in hub values and cycles through the remainders on
    division by 3, and the exit pair is built into the ladder; only the bad loop
    raises the index, so every peak ends a run, and every climb to a peak
    divisible by 3 passes through two thirds of it; and in every block of four
    consecutive indices the next indices add up to exactly one less (the exact
    fair-game average). The Collatz conjecture itself is stated in hub form and
    never claimed.
  improves: >-
    Restates the Collatz map exactly in the network's 6n±1 columns and proves
    the structure (runs, exits, ladders, funnels) that the numerical studies of
    this project rest on; no new case of the conjecture is settled.

