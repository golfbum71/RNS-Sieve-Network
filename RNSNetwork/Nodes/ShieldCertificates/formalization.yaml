node:
  id: ShieldCertificates.v1
  family: ShieldCertificates
  version: v1
  order: 10
  kind: paper
  status: active
  title: "certifying primes, and why prime runs stop"
  description: >-
    If a set of wheels covers every prime up to the square root of the
    ceiling, surviving them proves primality, for single numbers, evenly
    spaced runs in either direction, and offset patterns. Conversely, a wheel
    that does not divide the spacing must block one of any run as long as the
    wheel itself, which caps the run length and forces the Lagrange–Waring
    condition on real prime runs. Between a cutoff and its square, prime means
    exactly "no wheel divides it."

