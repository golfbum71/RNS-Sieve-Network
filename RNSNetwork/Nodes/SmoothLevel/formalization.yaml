  - smooth_level_bounded_gaps
  tier: "Tier 1 as statements; the proofs are cited. The statements use the column miss of LevelOfDistribution, with widths that divide the primorial modulus and are densely divisible."
  plan: "State each level as a cited claim in the vocabulary of LevelOfDistribution, with the widths restricted to densely divisible divisors of the primorial modulus; state the Motohashi-Pintz-Zhang step (any smooth level past one half gives bounded prime gaps) as a cited claim."
