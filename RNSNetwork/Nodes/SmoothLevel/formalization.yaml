  family: SmoothLevel
  version: v1
  order: 117
  kind: paper
  status: planned
  group: distribution
  title: "past the square root for cycles built from small wheels"
  description: "Restrict the widths in LevelOfDistribution to cycles built only from wheels below a small power of the largest number (the RNS cycles, divisors of the primorial modulus). For these the level is known past one half: Zhang reached one half plus 1/584, Polymath one half plus 7/300, and Stadlmann one half plus 1/40, then 0.5253. These are Zhang-type estimates; they need the cycles to split into factors of chosen sizes (DenseDivisibility) and are the input to Zhang's bounded gaps. Cited, not proved: the proofs rest on Kloosterman sums and Deligne's bounds, which are outside the RNS."
conclusions: []
