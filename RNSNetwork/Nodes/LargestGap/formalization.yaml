  order: 33
  kind: paper
  status: planned
  title: the largest gap from the proportional share
  description: Adding one wheel at most doubles the largest gap between the survivor count and its
    proportional share, minus one over the new prime; and the average squared gap over the survivor
    positions has an exact formula.
conclusions: []
planned:
  source_status: New
  rests_on:
  - Sawtooth
  - UniformSubdivision
  claims:
  - largest_gap_add_wheel
  - mean_square_gap
  tier: 'largest_gap_add_wheel: Tier 2, multi-session. mean_square_gap: Tier 3 (moved up 2026-11-04):
    its proof integrates the squared gap over the cycle (Theorem 4(v), via Franel''s formula) and
    needs real integration.'
  plan: 'largest_gap_add_wheel (Codecà-Nair Theorem 1(i)): their gap counts the endpoint, matching
    survivors_upto, and their identity (I) is UniformSubdivision.one_wheel_removed written as a gap.
    Session 1: define the largest gap as a maximum over survivor positions and prove it equals their
    supremum over real fractions (their preliminary discussion: the gap is piecewise linear, its
    maximum is reached at survivor positions, and its infimum is one minus the maximum by mirror
    symmetry). Session 2: the inequalities (7) and (8) of their proof, by the neighbouring-survivor
    argument. Session 3: the case split on r that gives Theorem 1(i).'
sources:
