node:
  id: MaierMatrix.v1
  family: MaierMatrix
  version: v1
  order: 98
  kind: paper
  status: planned
  title: short windows with too many and too few primes
  description: 'Maier''s matrix: rows are windows of length (log x) to a power A, columns are the positions
    coprime to a product P of wheels from a middle range. Counting primes by rows and by columns must
    agree, but the number of columns differs from the length times the share of P by a factor that oscillates
    (the Buchstab function minus e to minus Euler''s constant). So some windows hold noticeably more primes
    than average and some fewer. The column count is finite and wheel-native; the prime counts in progressions
    modulo P are cited.'
conclusions: []
planned:
  source_status: Cited
  rests_on:
  - SpreadBounds
  - BuchstabIdentity
  claims:
  - maier_column_identity
  - maier_irregularity
  tier: 'maier_column_identity: Tier 1. maier_irregularity: Tier 3, with the prime number theorem in progressions
    modulo P as a cited hypothesis.'
  plan: 'maier_column_identity: double count the matrix. The oscillation of the column count comes from
    Buchstab''s identity for wheels in a range, as in Soundararajan''s Exercise 11.'
sources:
- title: K. Soundararajan, The distribution of prime numbers (lectures), arXiv:math/0606408
  url: https://arxiv.org/abs/math/0606408
  relationship: Lecture 3, (3.1)-(3.4), Maier's theorem and Exercise 11
