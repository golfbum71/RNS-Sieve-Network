node:
  id: MaierMatrix.v1
  family: MaierMatrix
  version: v1
  order: 98
  kind: paper
  status: active
  title: short windows with too many and too few primes
  improves: "UniformSubdivision and SpreadBounds compare survivor counts with their share over whole cycles; this node sets up Maier's matrix, where that comparison in short windows decides whether windows hold too many or too few primes."
  description: "Maier's matrix: rows are windows of length (log x) to a power A, columns are the positions coprime to a product P of wheels from a middle range. Counting primes by rows and by columns must agree, but the number of columns differs from the length times the share of P by a factor that oscillates (the Buchstab function minus e to minus Euler's constant). So some windows hold noticeably more primes than average and some fewer. The column count is finite and wheel-native; the prime counts in progressions modulo P are cited. As proved, differs from the plan: the double count is proved, plus an added claim, maier_row_count: from the first row on, a row's prime entries are exactly the primes of its window. Maier's theorem itself (maier_irregularity) is cited from Maier 1985, not proved, as planned. The oscillation of the column count (Buchstab's identity for the wheels of a middle range, Soundararajan's Exercise 11) is not stated, so the planned arrows from SpreadBounds and BuchstabIdentity are not drawn."
conclusions:
- id: maier_column_identity
  declaration: RNS.MaierMatrix.maier_column_identity
  summary: "The prime entries of Maier's matrix counted by rows equal those counted by columns."
