- id: maier_irregularity
  declaration: RNS.MaierMatrix.maier_irregularity
  summary: "Windows of length a power above 1 of log x hold infinitely often noticeably more, and infinitely often noticeably fewer, primes than their length over log x (cited)."
  imports: []
  imports_status: none
  justifications:
