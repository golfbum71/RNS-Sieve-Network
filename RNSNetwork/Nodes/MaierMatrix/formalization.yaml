    kind: literature
    source: "H. Maier, Primes in short intervals, Michigan Math. J. 32 (1985), 221-225"
    locator: "Theorem 1 (limsup above 1 and liminf below 1 of the ratio)"
    note: "Published theorem, cited. Not reproduced in Lean. Maier states it as limsup and liminf of the ratio; the margin form here follows from those."
  designated: paper
