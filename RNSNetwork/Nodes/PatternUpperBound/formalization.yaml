node:
  id: PatternUpperBound.v1
  family: PatternUpperBound
  version: v1
  order: 75
  kind: paper
  status: planned
  title: every admissible pattern is at most its conjectured order
  description: For an admissible pattern of linear forms, the positions up to N where every form is prime
    are at most a constant times the pattern's correction constant times N over the logarithm of N to
    the number of forms. This is the strongest unconditional statement known in the direction of the Hardy-Littlewood
    conjecture, and covers twins, triples, pairs at any gap and Sophie Germain pairs. Ford, Theorem 2.5.
  improves: BrunAnalytic bounds the twins by N over log N to the 3/2; this gives every pattern at the
    full conjectured order.
conclusions: []
