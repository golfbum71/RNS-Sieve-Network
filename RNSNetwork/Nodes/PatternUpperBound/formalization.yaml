# Node metadata, following the shape of IEANTN's formalization.yaml.
# Scoped 2026-11-08 from Ford's Spring 2023 sieve notes, Ch. 1-4; built 2026-11-15 on SelbergBound and BadWheels. See docs/NODE_LIST.md.

node:
  id: PatternUpperBound.v1
  family: PatternUpperBound
  version: v1
  order: 75
  kind: paper
  status: active
  title: every pattern of linear forms is at most its conjectured order
  description: "For a pattern of primitive linear forms (each form a times the position plus b, with a at least 1 and a, b sharing no factor), the positions up to N where every form is prime number at most a constant depending only on the number of forms, times the bad factor, times N over the logarithm of N to the power of the number of forms. The bad factor is the product, over the wheels larger than the number of forms that divide the bad product of BadWheels, of (the wheel minus the positions it blocks) over (the wheel minus the number of forms); for a prime pair at gap h it is the gap's own correction (the product over the odd wheels dividing h of the wheel minus 1 over the wheel minus 2), and for the Sophie Germain pair (n and 2n + 1) it is 1. The proof is Selberg's sieve with every wheel above the number of forms kept in, each at its own share (positions blocked over the wheel), the bad wheels included at their smaller share. The node proves the four stages: the count of positions where a product of wheels divides the product of the forms (Chinese Remainder Theorem), Selberg's bound for the pattern, the lower bound for Selberg's pattern sum (of the order of log of the level to the power of the number of forms, divided by the bad factor), and the count. Ford, Theorem 2.5. As proved, differs from the plan: Selberg's sieve (SelbergBound) in place of the Brun-Hooley sieve; the singular series is replaced by the product of its bad-wheel factors (enough for every use downstream); the constant is not given as a number in the statement; and admissibility is not assumed (an inadmissible pattern has finitely many fitting positions and satisfies the bound anyway)."
  improves: "BrunAnalytic bounds the twins by N over log N to the 3/2, and SelbergTwinRails bounds pairs at a gap by leaving the wheels dividing the gap out of the sieve, which costs a factor of up to the gap over its totient. This node covers every pattern of linear forms at the full conjectured power of the logarithm, and keeps the wheels dividing the gap in the sieve, so a pair at gap h carries only the gap's own correction."
