# Lonely Runner family, added 2026-11-23. See docs/NODE_LIST.md.

node:
  id: ModulusLift.v1
  family: ModulusLift
  version: v1
  order: 123
  kind: paper
  status: active
  group: lonely
  title: a check passed at one cycle carries up to every multiple of it
  description: 'A list of speeds is good at a denominator when some time with that denominator is lonely.
    A good time with one denominator is also good with any multiple of it (stretch the numerator by the
    same factor), and whether a list is good depends only on the speeds'' remainders. So a list whose
    remainders were good at a smaller cycle never needs checking at a larger cycle built on it (bad_lists_lift);
    a list whose all-but-one share a factor with the smaller cycle still shares it with the larger one
    (proper_lifts). This is the same climb as rotating one more wheel into the combined cycle. Trakulthongchai
    2026, Definition 6 and Lemma 7: the sieve on the modulus that took the record to nine and ten runners.
    Uses only the vocabulary of PileUpLock.'
