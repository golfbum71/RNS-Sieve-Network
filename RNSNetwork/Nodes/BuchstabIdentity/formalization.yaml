node:
  id: BuchstabIdentity.v1
  family: BuchstabIdentity
  version: v1
  order: 83
  kind: paper
  status: active
  improves: "SurvivorCount and BrunPureSieve count the survivors of a fixed set of wheels; this node says how the count changes when wheels are added, one at a time (Legendre) or several at once (Buchstab)."
  title: adding one wheel, counted by the first wheel that blocks
  description: 'The survivors of the wheels up to a larger prime equal the survivors of the wheels up
    to a smaller one, minus, for each wheel in between, the positions it is the first to block. With the
    plain pattern this is Legendre''s recurrence for phi(x, a): bringing in the next wheel removes the
    survivors of the earlier wheels among the multiples of the new prime. Buchstab''s identity, Ford Lemma
    3.8.'
conclusions:
- id: legendre_phi_recurrence
  declaration: RNS.BuchstabIdentity.legendre_phi_recurrence
  summary: "Adding a prime wheel q removes the survivors of the earlier wheels up to N divided by q."
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/BuchstabIdentity.lean
    declaration: RNS.BuchstabIdentity.legendre_phi_recurrence_holds
    note: "Complete Lean proof checked by `lake build RNSSolutions` (standard axioms only, 2026-11-08). Recorded as noncompliant only because no Comparator receipt exists yet."
  designated: lean-proof
- id: buchstab_identity
  declaration: RNS.BuchstabIdentity.buchstab_identity
  summary: "Survivors of old and new wheels = survivors of the old wheels minus, per new wheel, the positions it is the first new wheel to block."
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/BuchstabIdentity.lean
    declaration: RNS.BuchstabIdentity.buchstab_identity_holds
    note: "Complete Lean proof checked by `lake build RNSSolutions` (standard axioms only, 2026-11-08). Recorded as noncompliant only because no Comparator receipt exists yet."
  designated: lean-proof
- id: buchstab_product_identity
  declaration: RNS.BuchstabIdentity.buchstab_product_identity
  summary: "The product of one minus each share is one minus the sum of each share times the product for the smaller wheels."
  imports: []
  imports_status: none
  justifications:
