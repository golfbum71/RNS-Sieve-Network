node:
  id: BuchstabIdentity.v1
  family: BuchstabIdentity
  version: v1
  order: 83
  kind: paper
  status: planned
  title: adding one wheel, counted by the first wheel that blocks
  description: 'The survivors of the wheels up to a larger prime equal the survivors of the wheels up
    to a smaller one, minus, for each wheel in between, the positions it is the first to block. With the
    plain pattern this is Legendre''s recurrence for phi(x, a): bringing in the next wheel removes the
    survivors of the earlier wheels among the multiples of the new prime. Buchstab''s identity, Ford Lemma
    3.8.'
conclusions: []
