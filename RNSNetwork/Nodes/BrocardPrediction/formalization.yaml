- title: "O. Ramaré and S. Zuniga-Alterman, From explicit estimates for the primes to explicit estimates for the Möbius function II (arXiv 2408.05969)"
  url: https://arxiv.org/abs/2408.05969
  relationship: "a sharper bound on the same Möbius sum, which would narrow the size statement"
- title: "R. C. Baker, G. Harman, J. Pintz, The difference between consecutive primes, II"
