# Node metadata, following the shape of IEANTN's formalization.yaml.
# Scoped 2026-11-14 from the Brocard window session; exact count and closed form built 2026-11-14. See docs/NODE_LIST.md and docs/BROCARD_NOTES.md.

node:
  id: BrocardPrediction.v1
  family: BrocardPrediction
  version: v1
  order: 104
  kind: paper
  status: active
  title: "the cycling-only count of primes between two prime squares"
  improves: >-
    BrocardWindow gives the rule for two wheels sharing a slot. This node
    counts with it: the exact number of slots each wheel is the first to
    block, the exact link from those counts to the primes of the window, and
    the closed form of the count that keeps only the forced shared-slot
    terms.
  description: >-
    The window is the numbers strictly between a base prime's square and the
    next prime's square; the slots are the window numbers on the 6n-1 and
    6n+1 tracks; the wheels are the primes from 5 up. First, the exact count:
    the slots a wheel is the first to block number an alternating sum, over
    the sets of smaller wheels, of the shared slots of the wheel and the set
    (Legendre's formula in collision-rule form), and the primes of the window
    plus the first-blocked slots of every wheel up to the base prime are
    exactly the slots. Second, the cycling-only count: replace each
    shared-slot count by its forced value (the window length over three times
    the product of the wheels) and drop every product longer than the window.
    When the window length is below five times the base prime plus five, as
    it is for twin primes, this collapses to a third of the window length
    times (one, minus the sum of the reciprocals of the primes above the base
    prime up to the window length, minus a Möbius sum over the numbers up to
    the window length on the tracks). For twin primes the prediction, a third
    of the window length minus one minus that count, is then a third of the
    window length times (the reciprocal sum plus the Möbius sum), minus one.
    None of this bounds the true number of primes in the window; that the
    true count stays near the prediction in every window is open, and is
    Brocard's conjecture in another form. As proved, differs from the plan.
    The exact count and the closed form need only Mathlib, so the planned
    arrow from BrocardWindow is not drawn (it is a related node). The closed
    form holds for any window length from the base prime up to five times the
    base prime plus four, not only for twins. The twin prediction takes a
    third of the window length minus one as the number of slots; that count
    was checked numerically and is not a Lean claim. The size of the
    prediction, with explicit constants, is not proved and stays planned: it
    needs published explicit estimates as outside claims, and its constants
    have not been independently reviewed. The prediction and its closed form
    are original to this project (Geoffrey Fischer, 2026-11-14); the exact
    count is Legendre's formula.

