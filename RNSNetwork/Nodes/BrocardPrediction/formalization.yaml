# Node metadata, following the shape of IEANTN's formalization.yaml.
# Planned node (2026-11-14, from the Brocard window session): scoped, no Lean yet. See docs/NODE_LIST.md and docs/BROCARD_NOTES.md.

node:
  id: BrocardPrediction.v1
  family: BrocardPrediction
  version: v1
  order: 104
  kind: paper
  status: planned
  title: "the cycling-only count of primes between two prime squares"
  description: >-
    Three statements about the window between a base prime's square and the
    next prime's square, built on the collision rule of BrocardWindow. First,
    the exact count: the slots a wheel is the first to block equal an
    alternating sum, over products of distinct smaller wheels, of the number
    of shared slots (Legendre's formula in collision-rule form). Second, the
    cycling-only prediction: replace each shared-slot count by its forced
    value (window length over three times the product) and drop every product
    longer than the window; for twin primes the sum collapses to a third of
    the window length times the sum of the reciprocals of the primes between
    the base prime and the window length, plus a Möbius sum over the numbers
    up to the window length not divisible by 2 or 3, minus one. Third, the
    size of that prediction, with explicit constants. None of this bounds the
    true number of primes in the window: that the true count stays near the
    prediction in every window is open, and is Brocard's conjecture in
    another form. The prediction and its closed form are original to this
    project (Geoffrey Fischer, 2026-11-14); the size uses published explicit
    estimates.
conclusions: []
planned:
  source_status: New
  rests_on:
  - BrocardWindow
  claims:
  - window_exact_count
  - cycling_prediction_closed_form
  - cycling_prediction_size
  tier: "Tier 2 for the exact count and the closed form (finite sums and a telescoping rearrangement); Tier 3 for the size (needs explicit Mertens and Möbius-sum estimates as outside claims)."
  plan: >-
    State the shared-slot count from BrocardWindow's collision rule and prove
    the exact count by inclusion-exclusion (BrunPureSieve carried all the
    way). Define the prediction as a finite sum over wheels and products of
    smaller wheels, and prove the closed form by matching each term to a
    squarefree number up to the window length. For the size, take the
    Rosser-Schoenfeld bound on the sum of prime reciprocals and Ramaré's
    bound on the Möbius sum as named outside claims. The assembly of the
    constants (session record of 2026-11-14) has not been independently
    reviewed and must be re-derived before it is stated in Lean.
