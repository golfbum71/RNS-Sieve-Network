planned:
  source_status: New
  rests_on: []
  claims:
  - cycling_prediction_size
  tier: "Tier 3: needs explicit Mertens and Möbius-sum estimates as outside claims."
  plan: >-
    Take the Rosser-Schoenfeld bound on the sum of prime reciprocals and
    Ramaré's bound on the Möbius sum as named outside claims. The assembly of
    the constants (session record of 2026-11-14) has not been independently
    reviewed and must be re-derived before it is stated in Lean.
sources:
- title: "Legendre sieve (Wikipedia)"
  url: https://en.wikipedia.org/wiki/Legendre_sieve
  relationship: "the exact count is Legendre's formula for one window"
- title: "J. B. Rosser and L. Schoenfeld, Approximate formulas for some functions of prime numbers, Illinois J. Math. 6 (1962)"
  url: https://projecteuclid.org/download/pdf_1/euclid.ijm/1255631807
  relationship: "Theorem 5, the sum of prime reciprocals with an explicit error, used for the size"
- title: "H. A. Helfgott, The ternary Goldbach problem (arXiv 1501.05438)"
  url: https://arxiv.org/abs/1501.05438
  relationship: "equation (2.21) records Ramaré's explicit bound on the sum of mu(n)/n, used for the size"
- title: "O. Ramaré and S. Zuniga-Alterman, From explicit estimates for the primes to explicit estimates for the Möbius function II (arXiv 2408.05969)"
  url: https://arxiv.org/abs/2408.05969
  relationship: "a sharper bound on the same Möbius sum, which would narrow the size statement"
- title: "R. C. Baker, G. Harman, J. Pintz, The difference between consecutive primes, II"
  url: https://doi.org/10.1112/plms/83.3.532
  relationship: "the published floor for primes in slightly longer windows; the open side of this node is the same kind of floor for a Brocard window"
related:
- node: BrocardWindow
  note: "the collision rule (two wheels share a slot only at a multiple of their product) that the shared-slot count applies to every set of wheels; no claim of BrocardWindow is taken as a hypothesis"
- node: BrunPureSieve
  note: "the alternating count and its early-stopping inequalities; the prediction is a different truncation (by cycle length, not by number of wheels)"
- node: MertensSecond
  note: "the sum of prime reciprocals that the closed form reduces to"
- node: GapConjectures
  note: "states Brocard's conjecture, which this prediction estimates but does not prove"
- node: ParityBarrier
  note: "why wheel counting alone cannot turn the prediction into a guaranteed floor"
