node:
  id: UnitSquares24.v1
  family: UnitSquares24
  version: v1
  order: 107
  kind: paper
  status: active
  group: onewheel
  title: "24 is the largest cycle on which every open position squares to 1"
  description: "On the cycle of a given length, call a position open when it shares no factor with the length. Every open position squares to 1 on the cycle exactly when the length divides 24. So every prime from 5 on squares to one more than a multiple of 24. In number-field language this says the number w₂ of the rational numbers is 24 (the largest cycle whose units all have order dividing 2, the Carmichael function dividing 2); it is the same 24 that appears in the Birch–Tate formula (node BirchTateRational). A classical fact, not new here."
conclusions:
- id: units_square_one_iff
  declaration: RNS.UnitSquares24.units_square_one_iff
  summary: "For a cycle length other than 0, every unit of the cycle squares to 1 exactly when the length divides 24."
