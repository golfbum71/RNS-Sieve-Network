  title: a positive share of numbers are a prime plus a power of 2
  description: A positive proportion of positive integers can be written as a prime plus a power of 2
    (Romanoff 1934). The proof bounds the second moment with the prime-pair bound at gaps that are differences
    of powers of 2.
