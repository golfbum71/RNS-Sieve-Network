node:
  id: HasseCurve.v1
  family: HasseCurve
  version: v1
  order: 110
  kind: paper
  status: active
  group: onewheel
  title: "three consecutive positions, and Hasse's bound for y² = x³ − x"
  description: "On an odd prime wheel, multiply three consecutive positions together and ask whether the product is a square. Shifted by one, that product is x³ − x, so its quadratic character counts the points of the elliptic curve y² = x³ − x on the wheel. When the wheel size leaves remainder 3 on dividing by 4, the character sum is exactly 0 and the curve has exactly the wheel size many points (the supersingular case), proved here. On every odd prime wheel the squared character sum is at most four times the wheel size: Hasse's theorem (1933) for this curve, here a step from Weil's bound for the pattern 0, 1, 2 (StepanovWeil, cited), so conditional on that citation."
  improves: "StepanovWeil bounds any pattern; this node is the three-offset pattern of consecutive positions, with the exact count in the supersingular case."
