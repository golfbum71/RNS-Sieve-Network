  title: the survivor share falls like one over the logarithm
  description: After the wheels up to a given prime, the surviving share of the cycle is at
    most one over the logarithm of that prime plus one, and the twin share is at most twice
    the square of that. The first also forces infinitely many primes.
conclusions: []
