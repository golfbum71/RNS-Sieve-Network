node:
  id: ShareBounds.v1
  family: ShareBounds
  version: v1
  order: 26
  kind: paper
  status: active
  title: the survivor share falls like one over the logarithm
  description: With the wheels below a bound, the surviving share of the cycle is at most one over
    the logarithm of the bound, and the twin share is at most twice the square of that. Checked numerically
    beforehand for wheels up to 200,000; the share times the logarithm approaches 0.5615, the constant
    in MertensThird.
