  source_status: New
  rests_on:
  - SurvivorCount
  claims:
  - survivor_share_le_inv_log
  - twin_share_le_two_inv_log_sq
  plan: The reciprocal of the share expands into a sum over numbers built from the wheel primes,
    which includes every number up to the last wheel, so it is at least the harmonic sum.
  evidence: Both checked for wheels up to 200,000; the share times the logarithm approaches
    0.5615, the constant in MertensThird.
  tier: 'Tier 1: elementary, using Mathlib''s log_add_one_le_harmonic.'
