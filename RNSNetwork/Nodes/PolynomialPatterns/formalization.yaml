node:
  id: PolynomialPatterns.v1
  family: PolynomialPatterns
  version: v1
  order: 89
  kind: paper
  status: active
  title: 'polynomial patterns: admissibility and the Bateman-Horn conjecture'
  improves: "Admissibility treats patterns of offsets; this node extends the blocked count to polynomial patterns, reduces admissibility to the wheels up to the total degree, and shows how Bateman-Horn for n^2 + 1 would give Landau's fourth problem."
  description: "For polynomial patterns such as n^2 + 1, a wheel blocks the roots of the polynomials on that wheel, and admissibility asks that no wheel be fully blocked. Stated: the Bateman-Horn conjecture as a named hypothesis, with the step that it gives infinitely many primes of the form n^2 + 1 (Landau's fourth problem). The constant's convergence for n^2 + 1 depends on how primes split between remainders 1 and 3 on division by 4, so it also enters as a hypothesis. As proved, differs from the plan: the Bateman-Horn conjecture is stated for the single polynomial n^2 + 1 (bateman_horn_sq_add_one), not for general polynomial patterns; the general statement stays planned. The convergence of its constant (sq_add_one_constant_converges, with the limit positive) is a known theorem, not an open conjecture, but it is not proved here, so it is taken as a hypothesis as planned. The finite check needs that no prime divides every coefficient of any polynomial, and checks the wheels up to the total degree. The step does not use the Admissibility node, so the planned arrow from it is not drawn. The counts of blocked positions for n^2 + 1 on every wheel (1, none, or 2) are not stated; only the wheel 2 is needed for admissibility."
