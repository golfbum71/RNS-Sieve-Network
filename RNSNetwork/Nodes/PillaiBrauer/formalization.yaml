node:
  id: PillaiBrauer.v1
  family: PillaiBrauer
  version: v1
  order: 45
  kind: paper
  status: active
  title: runs where no member is coprime to all the others
  description: Among any 16 or fewer consecutive positive integers one is coprime to all the others
    (Pillai, cited). From 17 on this fails, through the wheels up to 13. The run 2184 to 2200 has every
    member sharing one of the wheels 2, 3, 5, 7, 11, 13 with another member, and shifting it by any
    multiple of their combined cycle 30030 keeps that, so there are infinitely many such runs.
conclusions:
- id: pillai_sixteen
  declaration: RNS.PillaiBrauer.pillai_sixteen
  summary: Any run of 1 to 16 consecutive positive integers has a member coprime to every other member
    (cited).
  imports: []
  imports_status: none
  justifications:
  - id: paper
    kind: literature
    source: S. S. Pillai (1940), as stated in M. Waldschmidt's notes on Pillai's work (exact paper reference to be checked)
    locator: main theorem
    note: Published theorem, cited. Not reproduced in Lean; it needs a case analysis over every
      position of the cycle 30030 (checked numerically for every start up to 30030 on 2026-11-05).
  designated: paper
- id: pillai_witness_17
  declaration: RNS.PillaiBrauer.pillai_witness_17
  summary: Each of 2184, ..., 2200 shares one of the wheels 2, 3, 5, 7, 11, 13 with another member of
    the run.
  imports: []
  imports_status: none
