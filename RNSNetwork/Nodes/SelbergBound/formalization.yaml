# Node metadata, following the shape of IEANTN's formalization.yaml.
# See docs/NODE_LIST.md for the plain-language list of all nodes.

node:
  id: SelbergBound.v1
  family: SelbergBound
  version: v1
  order: 101
  kind: paper
  status: active
  title: Selberg's upper bound sieve
  improves: Mathlib sets up the Selberg sieve and diagonalises its main term but stops before the
    bound; this node completes it, so the twin columns can be bounded with the conjectured order.
  description: For a sieve problem in Mathlib's form (weighted finite set, wheel product, multiplicative
    density strictly between 0 and 1 at each wheel, total mass X, level), Selberg's Lambda-squared
    weights give - the sifted sum is at most X over Selberg's bounding sum, plus, over the divisors d of
    the wheel product up to the level, 3 to the number of prime factors of d times the size of the error
    at d. The proof is Arend Mellendijk's from PrimeNumberTheoremAnd, ported here and checked by this
    repository's build.
