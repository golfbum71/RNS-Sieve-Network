node:
  id: BrunTwinBound.v1
  family: BrunTwinBound
  version: v1
  order: 67
  kind: paper
  status: active
  improves: Joins Brun stages 1 to 3 into one upper bound for the twin survivors with every error term
    explicit, and links twin primes to twin survivors; stage 4 of Brun's theorem.
  title: Brun's upper bound for the twin survivors, with every error term (Brun stage 4)
  description: The twin survivors of prime wheels up to N are at most N times (the product of one minus
    each wheel's twin share, plus the sum over the sets of one more wheel than the stopping point of the
    products of their twin shares), plus the total number of twin roots over the sets used. Twin prime
    pairs up to N are at most L plus the twin survivors of the wheels below L.
