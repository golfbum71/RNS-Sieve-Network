node:
  id: RamanujanSums.v1
  family: RamanujanSums
  version: v1
  order: 51
  kind: paper
  status: active
  title: the survivor pattern's frequencies, wheel by wheel
  description: Ramanujan's sum for the combined cycle, the survivors of one cycle turned by a chosen
    frequency and added up, is a product over the wheels. A wheel contributes its size minus 1 if it
    divides the frequency, and minus 1 if not. So each wheel acts on the frequencies independently.
    Mathlib does not define Ramanujan sums; the sum is defined here.
conclusions:
- id: ramanujan_wheel_product
  declaration: RNS.RamanujanSums.ramanujan_wheel_product
  summary: For prime wheels, Ramanujan's sum of the cycle at any frequency is the product over the wheels
    of (wheel size minus 1) when the wheel divides the frequency and minus 1 when it does not.
