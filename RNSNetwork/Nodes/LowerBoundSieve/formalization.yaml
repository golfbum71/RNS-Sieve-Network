node:
  id: LowerBoundSieve.v1
  family: LowerBoundSieve
  version: v1
  order: 85
  kind: paper
  status: planned
  title: twin columns with few prime factors
  description: 'A lower-bound sieve: with the wheels up to a small power of N, the survivors are at least
    a fixed positive fraction of the total times the share, minus remainders. Consequence: at least a
    constant times N over log N squared positions have both 6n-1 and 6n+1 with at most 7 prime factors
    each. Ford Theorems 3.2-3.3 and Section 1.7.2.'
