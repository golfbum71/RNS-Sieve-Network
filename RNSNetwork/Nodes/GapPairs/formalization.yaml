# Node metadata, following the shape of IEANTN's formalization.yaml.
# Scoped 2026-11-08 from Ford's Spring 2023 sieve notes, Ch. 1-4; built 2026-11-14 on SelbergTwinRails. See docs/NODE_LIST.md.

node:
  id: GapPairs.v1
  family: GapPairs
  version: v1
  order: 76
  kind: paper
  status: active
  title: prime pairs at any gap, and Goldbach pairs, by the gap's own constant
  description: "Prime pairs up to N a fixed gap apart, and the ways of writing a number as a sum of two primes, number at most 40000 N over log N squared, times the gap's own correction from GapConstant (the product, over the odd wheels dividing the gap, of the wheel minus 1 over the wheel minus 2), times one extra factor: the gap over Euler's phi of the gap. In terms of the totient alone the bound is 40000 N over log N squared times the cube of the gap over its totient. After Ford, Corollary 2.6. As proved, differs from the plan: the node rests on SelbergTwinRails, not on PatternUpperBound, and Ford's corollary has the first power of the gap over its totient where this has the correction times the first power (at most the cube). The loss comes from SelbergTwinRails leaving the wheels that divide the gap out of the sieve; the first-power form is still planned and needs those wheels kept in (PatternUpperBound)."
  improves: "SelbergTwinRails states its bound with its own factor (the wheels from 5 up dividing the gap, each as the wheel over the wheel minus 2). This node compares that factor with the conjectured correction of GapConstant and with the gap over its totient, the forms used in the literature and by the nodes downstream (Schnirelmann, RomanoffTheorem)."
