# Node metadata, following the shape of IEANTN's formalization.yaml.
# Scoped 2026-11-08 from Ford's Spring 2023 sieve notes, Ch. 1-4; built 2026-11-14 on SelbergTwinRails. See docs/NODE_LIST.md.

node:
  id: GapPairs.v1
  family: GapPairs
  version: v1
  order: 76
  kind: paper
  status: active
  title: prime pairs at any gap, and Goldbach pairs, by the gap's own constant
  description: "Prime pairs up to N a fixed gap apart, and the ways of writing a number as a sum of two primes, number at most 40000 N over log N squared, times the gap's own correction from GapConstant (the product, over the odd wheels dividing the gap, of the wheel minus 1 over the wheel minus 2), times one extra factor: the gap over Euler's phi of the gap. In terms of the totient alone the bound is 40000 N over log N squared times the cube of the gap over its totient. These first claims rest on SelbergTwinRails, which leaves the wheels dividing the gap out of the sieve. Added 2026-11-15 from PatternUpperBound, which keeps those wheels in at their smaller share: the pairs at gap h number at most a fixed constant times the gap's correction alone times N over log N squared, and since the correction is at most twice the gap over its totient (a product that telescopes below 2), at most a fixed constant times the gap over its totient times N over log N squared: Ford's Corollary 2.6. The Goldbach pairs keep the earlier form (their forms n and N minus n have a negative coefficient, outside the encoding of PatternUpperBound)."
  improves: "SelbergTwinRails states its bound with its own factor (the wheels from 5 up dividing the gap, each as the wheel over the wheel minus 2). This node compares that factor with the conjectured correction of GapConstant and with the gap over its totient, the forms used in the literature and by the nodes downstream (Schnirelmann, RomanoffTheorem)."
