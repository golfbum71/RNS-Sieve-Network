node:
  id: GapPairs.v1
  family: GapPairs
  version: v1
  order: 76
  kind: paper
  status: planned
  title: prime pairs at any even gap, and Goldbach pairs
  description: Prime pairs up to N a fixed even gap apart number at most a constant times the gap over
    Euler's phi of the gap, times N over log N squared; pairs of primes adding to a given even number
    are bounded the same way. Ford, Corollary 2.6.
conclusions: []
planned:
  source_status: New
  rests_on:
  - PatternUpperBound
  - GapConstant
  claims:
  - gap_pair_bound
  - goldbach_pair_bound
  tier: 'Tier 2: a specialisation of pattern_count_le.'
  plan: The patterns n, n + gap and n, even number - n; their bad wheels are the primes dividing the gap
    (or the even number); the constant is bounded by GapConstant.
sources:
