  title: primes in a short window (PNT+)
  description: The number of primes in any window of a given length is at most twice the length over the
    logarithm of the sieve level, plus a small error, proved with the Selberg sieve in PrimeNumberTheoremAnd
    (primesBetween_le). Windows only, not arithmetic progressions.
