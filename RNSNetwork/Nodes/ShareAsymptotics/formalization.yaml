node:
  id: ShareAsymptotics.v1
  family: ShareAsymptotics
  version: v1
  order: 64
  kind: paper
  status: active
  improves: ShareBounds bounds the survivor share by one over the logarithm and the twin share by twice
    its square; this node gives the true rates, showing the first bound is sharp up to the factor e to
    the minus Euler's constant.
  title: how fast the survivor and twin shares of the cycle shrink
  description: With the wheels up to n, the share of the cycle that survives, times log n, tends to e to
    the minus Euler's constant (about 0.5615); the twin share times log n squared tends to twice the
    odd twin product times e to the minus twice Euler's constant (about 0.4162). Numerically 0.56144
    and 0.41618 at n a million.
