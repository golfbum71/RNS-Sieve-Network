        note: >-
          Complete Lean proof checked by `lake build RNSSolutions`. Recorded as noncompliant only because no Comparator
          receipt exists yet.
    designated: lean-proof
  - id: general_survivor_count
    declaration: RNS.SurvivorCount.general_survivor_count
    summary: "Survivors of the whole cycle: the product over the active wheels of the wheel size minus w."
    imports: 
      - CRT.v1.crt_map_bijective
    imports_status: identified  # every input is drawn as an edge
    justifications:
