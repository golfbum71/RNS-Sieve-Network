        note: >-
          Lean proof of the step from the imported claims, taken as named
          hypotheses; the proof file imports claims only, never proofs. Recorded as noncompliant only because no Comparator
          receipt exists yet.
    designated: lean-proof
  - id: local_survivor_count
    declaration: RNS.SurvivorCount.local_survivor_count
    summary: "On one wheel, the wheel size minus w positions survive an offset pattern."
    imports: []
    imports_status: none  # no inputs beyond Mathlib and the Vocabulary
