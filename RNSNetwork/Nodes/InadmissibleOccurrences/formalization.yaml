  order: 28
  kind: paper
  status: active
  title: inadmissible patterns sit next to their blocking wheel
  description: 'If an offset pattern covers every position on some wheel, every prime occurrence
    of it contains that wheel''s prime, so it occurs only finitely often. Corollary: the prime-gap
    block 2, 4, 2, 4, 2 occurs only at 5, 7, 11, 13, 17, 19. Proved directly from the definition
    of w; Admissibility''s claims are not needed.'
