node:
  id: AlmostPrimeWindow.v1
  family: AlmostPrimeWindow
  version: v1
  order: 60
  kind: paper
  status: active
  improves: ShieldCertificates shows that from the cutoff up to its square a survivor of the wheels is
    prime; this node goes one step further, up to the cube, where a survivor is a prime or a product of
    two primes. It generalises FortunateCeiling's cube claim from numbers added to the cycle to every
    number, and states the parity obstruction for the wheels exactly.
  title: survivors between the cutoff and its cube are primes or semiprimes
  description: Take the wheels below a cutoff. From the cutoff up to its cube, a number that no wheel
    divides is a prime or a product of exactly two primes, and the composite ones are exactly the
    products of two primes each at least the cutoff. This is the almost-prime mechanism behind Chen's
    theorem. In the window, a survivor is prime exactly when its number of prime factors is odd, which
    is where the parity problem sits for the wheels.
