  title: Brun's twin bound with log log squared
  description: Twin prime pairs up to N number at most a constant times N times (log log N over log N)
    squared, by stopping inclusion-exclusion after about four times the logarithm of one over the twin
    share, with the wheels up to N to the one over 16 log log N. Ford Section 1.11.1, Brun's 1919 bound.
  improves: BrunAnalytic proves N over log N to the 3/2; this reaches Brun's own exponent, within log
    log N squared of the truth.
