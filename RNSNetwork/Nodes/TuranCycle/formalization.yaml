# Node metadata, following the shape of IEANTN's formalization.yaml.
# See docs/NODE_LIST.md for the plain-language list of all nodes.

node:
  id: TuranCycle.v1
  family: TuranCycle
  version: v1
  order: 61
  kind: paper
  status: active
  improves: SurvivorCount counts survivors exactly; this node puts the classical second-moment
    (Turán) sieve on the same footing, with the average and spread of the wheel hits computed exactly
    rather than estimated, as the first step from exact counts to sieve bounds.
  title: Turán's sieve, exactly, on the positions 1 to N
  description: For a set of wheels, count at each position how many wheels divide it. Over the positions
    1 to N the hits total the multiples of each wheel, and the squared hits total the multiples of the
    least common multiple of each ordered pair of wheels, both exactly. Turán's second-moment
    inequality then bounds the survivors, since a survivor has no hits. Weak (about 15,100 against the
    true 5760 for the wheels up to 13 on one cycle) but exact in every ingredient.
conclusions:
