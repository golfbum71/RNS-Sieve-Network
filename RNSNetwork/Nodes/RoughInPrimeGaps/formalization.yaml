node:
  id: RoughInPrimeGaps.v1
  family: RoughInPrimeGaps
  version: v1
  order: 43
  kind: external
  status: planned
  title: almost every prime gap holds a survivor of the wheels below its length
  description: 'Almost every gap between consecutive primes contains a number whose smallest
    prime factor is at least the gap''s length: a survivor of every wheel smaller than the
    gap. Proved unconditionally by Gafni and Tao, answering Erdős Problem 682; proved in Lean
    in plby/lean-proofs.'
conclusions: []
planned:
  source_status: External
  rests_on: []
