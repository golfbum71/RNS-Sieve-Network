    note: The statement is erdos_682 in DeepMind's formal-conjectures (ErdosProblems/682.lean),
      which links this proof and marks it solved. The same entry links a Lean proof of a counterexample
      built on the 30030 cycle (erdos_682.variants.dickson_counterexample). Check toolchain
      and axioms before citing.
