node:
  id: HardyLittlewood.v1
  family: HardyLittlewood
  version: v1
  order: 14
  kind: paper
  status: active
  title: "the conjecture, and what it would give"
  description: >-
    The prime-pattern count is stated to grow like the constant times the
    number divided by its logarithm raised to the number of offsets. Proved:
    if that holds for the twin pattern, there are infinitely many twin primes.

conclusions:
