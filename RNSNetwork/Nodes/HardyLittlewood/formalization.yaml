    imports: 
      - SingularSeries.v1.hardy_littlewood_constant_pos
      - Admissibility.v1.zero_two_admissible
    imports_status: identified
    open_inputs: ["hardy_littlewood_conjecture"]  # open conjectures: hypotheses of the claim, never claimed
