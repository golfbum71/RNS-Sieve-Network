node:
  id: CeilingOvershoot.v1
  family: CeilingOvershoot
  version: v1
  order: 31
  kind: paper
  status: active
  improves: ShieldCertificates shows that below the ceiling the survivors are exactly the primes; this
    node shows that the wheel product does not count them correctly, overshooting by the factor twice e
    to the minus Euler's constant.
  title: the wheel product overshoots the primes by about 12%
  description: With the wheels up to the square root of x, the survivors below x are 1 and the primes
    above the wheels, but x times the survivor share, divided by the number of primes up to x, tends to
    twice e to the minus Euler's constant, about 1.1229. The classical demonstration that sieve error
    terms do not vanish once the wheels reach the square root. Numerically the ratio climbs slowly (0.91
    at a thousand, 1.05 at ten million).
