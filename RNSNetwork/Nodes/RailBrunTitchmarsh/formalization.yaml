node:
  id: RailBrunTitchmarsh.v1
  family: RailBrunTitchmarsh
  version: v1
  order: 82
  kind: paper
  status: active
  title: how many primes one column can hold in a window
  improves: "BrunTitchmarshPNT bounds the primes of a short window; this node carries the bound to one column of the 6n±1 wheel."
  description: "Each column, 6n-1 or 6n+1, holds at most about the window's length over the logarithm of five sixths of that length primes in any window, uniformly in where the window sits (Brun-Titchmarsh with modulus 6, constant 2 of Montgomery and Vaughan). A first, weaker form follows at once from the window bound for all primes. As proved, differs from the plan: only the first, weaker form is proved: the primes of one column in a window are among the window's primes, so PNT+'s window bound (twice the length over the logarithm of the sieve level, plus an error) bounds each column. The sharper bound for one column (about the length over the logarithm of five sixths of it, a Selberg sieve for the modulus 6) is not proved and stays planned. The column is any remainder on division by 6, not only 5 and 1; Wheel6 is not used, so the planned arrow from it is not drawn."
  improves: The window bound counts both columns together; this halves it per column.
