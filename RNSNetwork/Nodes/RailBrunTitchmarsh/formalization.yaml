node:
  id: RailBrunTitchmarsh.v1
  family: RailBrunTitchmarsh
  version: v1
  order: 82
  kind: paper
  status: planned
  title: how many primes one column can hold in a window
  description: Each column, 6n-1 or 6n+1, holds at most about the window's length over the logarithm of
    five sixths of that length primes in any window, uniformly in where the window sits (Brun-Titchmarsh
    with modulus 6, constant 2 of Montgomery and Vaughan). A first, weaker form follows at once from the
    window bound for all primes.
  improves: The window bound counts both columns together; this halves it per column.
conclusions: []
