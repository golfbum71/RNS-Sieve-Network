  order: 19
  kind: paper
  status: stub
  title: "which gaps each column allows"
  description: >-
    The smaller of two twin primes above 3 always lies in the 6n-1 column, and
    the smaller of two cousin primes in the 6n+1 column. In general, a gap
    starting from the 6n-1 column never leaves remainder 4 on division by 6,
    and a gap starting from the 6n+1 column never leaves remainder 2; a gap
    that is a multiple of 6 keeps both primes in the same column. One claim is
    refuted rather than proved: the number between two primes six apart is not
    always composite (5, 7, 11 is a counterexample).

