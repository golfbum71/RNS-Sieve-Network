node:
  id: BonseCeiling.v1
  family: BonseCeiling
  version: v1
  order: 44
  kind: paper
  status: active
  title: from four wheels on, the ceiling sits inside one cycle
  description: For every prime from 11 on, its square (the ceiling of the wheels below it) is smaller
    than the product of the wheels below it (their combined cycle). With wheels 2, 3, 5 the ceiling
    49 lies outside the cycle 30; once 7 is in, the ceiling 121 lies inside the cycle 210, and it
    stays inside from then on. This is Bonse's inequality.
conclusions:
- id: ceiling_inside_cycle
