node:
  id: BadWheels.v1
  family: BadWheels
  version: v1
  order: 73
  kind: paper
  status: active
  improves: "Admissibility asks only that every wheel block fewer positions than its size; this node counts exactly how many a pattern of linear forms blocks, and names the wheels that block fewer than one per form."
  title: which wheels block fewer positions for linear forms
  description: "For a pattern of linear forms whose two coefficients share no factor, a wheel blocks at most one position per form, and it blocks fewer exactly when it divides the bad product: the leading coefficients times the cross differences over ordered pairs of distinct forms. For the two columns 6n-1 and 6n+1 (forms 6n+5 and 6n+7) that product is -5184 = -2^6 3^4, so the wheels 2 and 3 are the only exceptions: the 6n±1 wheel is exactly the removal of the bad wheels. Ford, Theorem 2.5 (first part) and Lemma 7.7. As proved, differs from the plan: each form's two coefficients must share no factor (an added hypothesis); the bad product of the two columns is -5184, not 432 as first planned (the conclusion, wheels 2 and 3 only, is unchanged); and no claim of LinearForms is imported, only its encoding of a form as a pair of numbers, so the planned arrow from LinearForms is not drawn."
