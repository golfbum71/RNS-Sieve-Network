  plan: 'Session 1: build the SelbergSieve structure (support the positions up to N, prodPrimes the product
    of the primes from 5 to z, nu the twin share). Session 2: the sum J for h(p) = 2/(p-2) (Ford Theorem
    4.4). Session 3: Theorem 4.5 for the gap 2.'
