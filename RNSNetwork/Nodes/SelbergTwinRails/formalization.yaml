  declaration: RNS.SelbergTwinRails.selberg_twin_columns_bound
  summary: For any level y at least 1, the survivors of the twin columns (wheels from 5 up) among the
    positions 1 to N number at most N over Selberg's twin sum plus the sum, over divisors d of the wheel
    product up to y, of 6 to the number of prime factors of d.
