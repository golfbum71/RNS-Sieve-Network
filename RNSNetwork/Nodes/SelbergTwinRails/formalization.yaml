node:
  id: SelbergTwinRails.v1
  family: SelbergTwinRails
  version: v1
  order: 87
  kind: paper
  status: planned
  title: Selberg's bound for the twin columns
  description: The wheels from 5 up form a Selberg sieve problem for the twin columns, with each wheel's
    share two over the wheel; the wheels 2 and 3 must be left out, since Mathlib's sieve needs every share
    positive and the columns have share zero there. Selberg's Lambda-squared weights then give at most
    four times the twin-prime constant times N over log N squared twin pairs, four times the conjectured
    count. Ford Theorems 4.1 and 4.5.
  improves: The Brun nodes lose a power of log log N or of log N; this has the right order with an explicit
    constant.
conclusions: []
