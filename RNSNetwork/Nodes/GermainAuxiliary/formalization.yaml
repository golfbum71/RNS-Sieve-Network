node:
  id: GermainAuxiliary.v1
  family: GermainAuxiliary
  version: v1
  order: 56
  kind: paper
  status: active
  title: Sophie Germain's theorem with any suitable wheel
  description: If some prime wheel q has no two p-th power positions next to each other and does not
    have p at a p-th power position (an auxiliary prime), then x^p + y^p + z^p = 0 forces p to divide
    x y z. The wheel 2p+1 is auxiliary for Sophie Germain primes; the wheels 29 and 53, checked
    position by position, are auxiliary for 7 and 13, giving the first case of Fermat's Last Theorem
    for those exponents, which are not Sophie Germain primes.
conclusions:
