  plan: "Define the worst column miss for one width and the level-of-distribution property in RNS vocabulary (widths, survivor columns, fair share). Prove level_mono. State Bombieri-Vinogradov, Friedlander-Granville, the fixed-column record, Maynard's and Polymath8b's gap consequences and Bombieri's parity result as cited claims, and Elliott-Halberstam as a named open hypothesis. Check Axiom's PrimeGapsLib for its Bombieri-Vinogradov statement and match it, so PrimeGapsBridge can carry its results over."
