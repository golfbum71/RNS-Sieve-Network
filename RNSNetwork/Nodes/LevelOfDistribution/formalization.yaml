node:
  id: LevelOfDistribution.v1
  family: LevelOfDistribution
  version: v1
  order: 116
  kind: paper
  status: planned
  group: distribution
  title: "level of distribution: Bombieri-Vinogradov and the Elliott-Halberstam conjecture"
  description: "Fix a largest number. For every width up to a top width, lay the numbers out in rows of that width, compare each survivor column's prime count with its fair share, and keep the worst miss; add the worst misses over all widths. The primes have a level of distribution at a power of the largest number if that total is smaller than the prime count divided by any fixed power of its logarithm, with the top width that power of the largest number. Bombieri-Vinogradov proves the level one half (cited); the Elliott-Halberstam conjecture claims every level below one (an open hypothesis, never claimed); Friedlander and Granville showed the full width fails (cited). Also recorded: the best results past one half for a single chosen column with weighted widths (cited), what Elliott-Halberstam would give for prime gaps (cited), and Bombieri's result that even the full conjecture leaves the sieve unable to tell primes from products of two primes (cited)."
