node:
  id: Infinitude.v1
  family: Infinitude
  version: v1
  order: 11
  kind: paper
  status: active
  title: "two independent proofs that primes never run out"
  description: >-
    Euclid's argument using the combined cycle plus one; and a counting
    argument showing a fixed finite set of wheels cannot build enough
    square-free parts for every number.

conclusions:
  - id: euclid_primes_unbounded
    declaration: RNS.Infinitude.euclid_primes_unbounded
    summary: "Above every bound there is a prime (Euclid, via the combined cycle plus one)."
    imports: []
    imports_status: none
    justifications:
      - id: lean-proof
        kind: lean-noncompliant
        solution: RNSSolutions/Infinitude.lean
        declaration: RNS.Infinitude.euclid_primes_unbounded_holds
        note: >-
          Complete Lean proof checked by `lake build RNSSolutions` (standard axioms only, 2026-11-04). Recorded as noncompliant only because no Comparator
          receipt exists yet.
    designated: lean-proof
  - id: squarefree_counting_no_finite_supply
    declaration: RNS.Infinitude.squarefree_counting_no_finite_supply
    summary: "No bound has all primes below it (square-free counting)."
    imports: []
    imports_status: none
    justifications:
      - id: lean-proof
        kind: lean-noncompliant
        solution: RNSSolutions/Infinitude.lean
