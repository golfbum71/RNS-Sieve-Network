node:
  id: QuadraticCharSum.v1
  family: QuadraticCharSum
  version: v1
  order: 109
  kind: paper
  status: active
  group: onewheel
  title: "on one wheel, the residue character of a pair pattern adds up to −1"
  description: "On a prime wheel, give each position +1 if it is a nonzero square, −1 if it is not a square, and 0 at 0 (the quadratic character). For two offsets, multiply a position's distances from them and add the character of the product around the wheel: the total is −1 when the offsets sit on different positions of the wheel, and the wheel size minus 1 when they coincide. The same −1 holds for any quadratic whose discriminant is not 0, split or not. This is the exact degree-two case of the square-root bounds of Hasse and Weil (nodes HasseCurve, StepanovWeil); the proof goes through Mathlib's Jacobi sums. A classical fact, not new here."
