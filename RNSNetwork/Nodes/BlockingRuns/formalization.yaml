node:
  id: BlockingRuns.v1
  family: BlockingRuns
  version: v1
  order: 30
  kind: paper
  status: active
  title: blocking runs and the largest survivor gap
  description: A setting of the wheels (one blocked position per wheel) is a shift of the ordinary
    sieve, by the Chinese Remainder Theorem; so a run of consecutive numbers can be blocked by some
    setting exactly when some gap between consecutive survivors is at least one longer. The longest
    blocked run is one less than the largest survivor gap (Jacobsthal's function of the cycle length).
    With JacobsthalQuadratic, such runs are at most a constant times the square of the number of
    wheels. Checked numerically beforehand for the wheels below 14 over every setting.
