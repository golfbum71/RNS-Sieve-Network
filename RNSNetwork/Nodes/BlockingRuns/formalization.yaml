  status: planned
  title: blocking runs and the largest survivor gap
  description: Choosing one blocked position on each wheel up to a prime covers a run of consecutive
    numbers; the longest run that can be covered is one less than the largest gap between
    survivors of the cycle. With JacobsthalQuadratic, such runs are at most a constant times
    the square of the number of wheels.
