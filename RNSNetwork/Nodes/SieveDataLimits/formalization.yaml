node:
  id: SieveDataLimits.v1
  family: SieveDataLimits
  version: v1
  order: 94
  kind: paper
  status: active
  title: what the multiple counts alone can decide
  improves: "BrunPureSieve gives particular upper and lower sieves (inclusion-exclusion stopped early); this node shows that every upper or lower sieve is a valid bound, and on a worked case that the multiple counts alone leave a whole interval of survivor counts."
  description: "Knowing only how many numbers each product of wheels divides pins the survivor count to an interval, not a value; the best upper and lower bounds are linear programs whose duals are the upper and lower sieves. Worked case: if 100 numbers have 60 even and 10 divisible by 3, the numbers coprime to 6 are between 30 and 40, and both ends occur. Tao, 254A Notes 4 (Theorem 5, Exercises 4 and 8). As proved, differs from the plan: the worked case is proved in full (both bounds for every set with that data, and two explicit sets of 100 numbers reaching 30 and 40). Of the duality, only the weak half is proved: every upper sieve bounds the survivors from above and every lower sieve from below, for any wheels (not only primes) and any family of known multiple counts. The strong half, that the best sieve reaches the best possible bound (linear-programming duality), is not proved and stays planned."
