node:
  id: DirichletColumns.v1
  family: DirichletColumns
  version: v1
  order: 13
  kind: standard
  status: active
  title: "both columns hold infinitely many primes"
  description: >-
    Each of the two columns 6n-1 and 6n+1 holds infinitely many primes, and
    past any position there is a later prime in each column. This is
    Dirichlet's theorem on primes in arithmetic progressions, which Mathlib
    proves, applied to the two columns.

