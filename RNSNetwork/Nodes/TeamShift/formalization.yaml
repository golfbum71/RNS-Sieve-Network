- id: team_shift_step
  declaration: RNS.TeamShift.team_shift_step
  summary: If the Lonely Runner Conjecture holds for one runner fewer, a team of nonzero speeds sharing
    a factor, plus a speed that factor does not divide, has a lonely moment.
  imports:
