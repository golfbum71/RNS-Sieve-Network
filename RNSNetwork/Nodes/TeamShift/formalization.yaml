# Node metadata, following the shape of IEANTN's formalization.yaml.
# Lonely Runner family, built 2026-11-23. See docs/NODE_LIST.md.

node:
  id: TeamShift.v1
  family: TeamShift
  version: v1
  order: 120
  kind: paper
  status: active
  group: lonely
  title: 'a team sharing a factor: shift the clock, the team stays put, the last runner moves'
  description: 'Normalize so the runner to be lonely stands still. Suppose all moving runners but one
    share a common factor, while all speeds together share none. Take a good time for the team (from the
    conjecture for one runner fewer) and step the clock forward by multiples of one over the shared factor:
    every team runner returns to the same place, and the last runner moves among evenly spaced spots,
    one of which is good. So the set is lonely. Rosenfeld 2025, Lemma 5. The working form of Geo''s team
    (co-dependent) idea: the team need not be at the start, only already well spread. Conditional: the
    conjecture for one runner fewer is a named hypothesis. As proved, differs from the plan: stronger
    than Rosenfeld''s Lemma 5, since the team''s factor need only fail to divide the extra speed (the
    PileUpLock condition), not all speeds sharing no factor; the team must have at least two runners (Rosenfeld
    uses the lemma for at least three moving runners). The good spot is at least a quarter of a lap away,
    enough for the enlarged field of at least four runners. Uses only the vocabulary of PileUpLock (no
    claim of it).'
