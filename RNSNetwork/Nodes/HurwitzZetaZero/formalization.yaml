node:
  id: HurwitzZetaZero.v1
  family: HurwitzZetaZero
  version: v1
  order: 58
  kind: paper
  status: active
  title: the Hurwitz zeta function at 0
  description: For a point x with 0 < x ≤ 1, the Hurwitz zeta function at 0 equals one half minus x;
    equivalently, the sawtooth's Fourier series converges to the sawtooth. Cited, not proved here.
    Mathlib has the Hurwitz zeta values at the negative integers but stops short of 0, where the
    matching Fourier series converges only conditionally. It is the one analytic input
    GermainCriterion needs beyond Mathlib, and could be proved later or contributed to Mathlib without
    changing anything downstream.
conclusions:
- id: hurwitz_zeta_at_zero
  declaration: RNS.HurwitzZetaZero.hurwitz_zeta_at_zero
  summary: For 0 < x ≤ 1, the Hurwitz zeta function at 0 equals 1/2 - x (cited).
  imports: []
  imports_status: none
  justifications:
  - id: paper
    kind: literature
    source: T. M. Apostol, Introduction to Analytic Number Theory, Springer (1976), Chapter 12
    locator: Theorem 12.13 (the Hurwitz zeta function at the nonpositive integers), case n = 0
    note: Classical theorem, cited. Not yet proved in Lean; Mathlib's hurwitzZeta_neg_nat covers the
      negative integers only.
  designated: paper
sources:
- title: Hurwitz zeta function (Wikipedia), values at nonpositive integers
  url: https://en.wikipedia.org/wiki/Hurwitz_zeta_function
  relationship: states the value at 0 through the Bernoulli polynomial B1
- title: Mathlib, Hurwitz zeta values (hurwitzZeta_neg_nat)
