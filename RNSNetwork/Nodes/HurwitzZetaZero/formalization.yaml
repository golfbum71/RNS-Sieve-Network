node:
  id: HurwitzZetaZero.v1
  family: HurwitzZetaZero
  version: v1
  order: 58
  kind: paper
  status: active
  title: the Hurwitz zeta function at 0
  description: For a point x with 0 < x ≤ 1, the Hurwitz zeta function at 0 equals one half minus x.
    Proved here from Mathlib alone, filling the case s = 0 that Mathlib's hurwitzZeta_neg_nat leaves as
    a TODO. Mathlib's even part at 0 and its functional equation reduce it to Mathlib's sinZeta x at 1.
    That is the sum of the sawtooth's Fourier series, a conditionally convergent series. Abel summation
    and dominated convergence show sinZeta x at 1 is the sum of its series, and Abel's limit theorem
    sums the series to π(1/2 - x). It is the analytic input GermainCriterion needs beyond Mathlib.
conclusions:
- id: hurwitz_zeta_at_zero
  declaration: RNS.HurwitzZetaZero.hurwitz_zeta_at_zero
  summary: For 0 < x ≤ 1, the Hurwitz zeta function at 0 equals 1/2 - x.
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/HurwitzZetaZero.lean
    declaration: RNS.HurwitzZetaZero.hurwitz_zeta_at_zero_step
    assembled: RNSSolutions/HurwitzZetaZero.lean (RNS.HurwitzZetaZero.hurwitz_zeta_at_zero_holds)
    note: Lean proof built clean 2026-11-05 (standard axioms only). From the node's cited claim sin_zeta_at_one, Mathlib's
      hurwitzZetaEven_apply_zero and the functional equation hurwitzZetaOdd_one_sub at s = 1; the case
      x = 1 needs no cited input.
  - id: paper
    kind: literature
    source: T. M. Apostol, Introduction to Analytic Number Theory, Springer (1976), Chapter 12
    locator: Theorem 12.13 (the Hurwitz zeta function at the nonpositive integers), case n = 0
    note: Classical theorem.
  designated: lean-proof
- id: sin_zeta_at_one
  declaration: RNS.HurwitzZetaZero.sin_zeta_at_one
  summary: For 0 < x < 1, Mathlib's sinZeta x at 1 equals π(1/2 - x), the sum of the sawtooth's Fourier series.
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/HurwitzZetaZero.lean
    declaration: RNS.HurwitzZetaZero.sin_zeta_at_one_step
    assembled: RNSSolutions/HurwitzZetaZero.lean (RNS.HurwitzZetaZero.sin_zeta_at_one_holds)
    note: Lean proof built clean 2026-11-05 (standard axioms only). From sawtooth_partial_sums and the cited sin_zeta_at_one_eq_series, by uniqueness of limits.
  - id: paper
    kind: literature
    source: A. Zygmund, Trigonometric Series, Cambridge University Press (1959), Chapter I
    locator: the Fourier series of the sawtooth, sum of sin(nt)/n equals (π - t)/2 for 0 < t < 2π (take t = 2πx)
    note: Classical. Checked numerically at x = 0.1, 0.37, 0.5, 0.9 (partial sums to 200,000 terms).
  designated: lean-proof
- id: sawtooth_partial_sums
  declaration: RNS.HurwitzZetaZero.sawtooth_partial_sums
  summary: For 0 < x < 1, the partial sums of the sawtooth series, sin(2πnx)/n summed over n, tend to π(1/2 - x).
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/HurwitzZetaZero.lean
    declaration: RNS.HurwitzZetaZero.sawtooth_partial_sums_holds
    note: Lean proof built clean 2026-11-05 (standard axioms only). Dirichlet's test for convergence, Abel's limit theorem on the series for -log(1 - z) at z = e^(2πix) (Mathlib's AbelLimit and hasSum_taylorSeries_neg_log), and the argument of 1 - e^(2πix).
  designated: lean-proof
- id: sin_zeta_at_one_eq_series
  declaration: RNS.HurwitzZetaZero.sin_zeta_at_one_eq_series
  summary: For 0 < x < 1, the partial sums of the sawtooth series tend to Mathlib's sinZeta x at 1. Mathlib has the series for sinZeta only where it converges absolutely.
  imports: []
  imports_status: none
  justifications:
  - id: lean-proof
    kind: lean-noncompliant
    solution: RNSSolutions/HurwitzZetaZero.lean
    declaration: RNS.HurwitzZetaZero.sin_zeta_at_one_eq_series_holds
    note: Lean proof built clean 2026-11-05 (standard axioms only). Abel summation at s = 1 (the argument of Mathlib's LSeries_eq_mul_integral, which needs no absolute convergence) makes the partial sums tend to G(1), with G(s) the integral from 1 to infinity of the bounded partial-sum function times t^(-s-1). For real s > 1 Mathlib gives sinZeta x s = s G(s); letting s fall to 1, sinZeta is continuous (it is entire) and s G(s) is continuous by dominated convergence.
  designated: lean-proof
