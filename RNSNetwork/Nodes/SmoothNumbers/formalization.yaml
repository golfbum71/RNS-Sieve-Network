node:
  id: SmoothNumbers.v1
  family: SmoothNumbers
  version: v1
  order: 90
  kind: paper
  status: planned
  title: numbers built only from the wheels
  description: 'The numbers up to x whose prime factors are all wheels up to y. Rankin''s bound: their
    count is at most x to a power alpha times the product over the wheels of one over one minus the wheel
    to the minus alpha, for any alpha between 0 and 1; at alpha = 1 that product is the reciprocal of
    the survivor share. A lower bound counts the products of the wheels directly, and a Buchstab-type
    identity removes the largest wheel. Ford Chapter 5.'
conclusions: []
planned:
  source_status: New
  rests_on: []
  claims:
  - rankin_upper
  - smooth_count_lower
  - smooth_buchstab
  tier: 'Tier 1: all three are finite.'
  plan: 'rankin_upper: each counted number n has (x/n)^alpha >= 1; sum over all products of the wheels
    (a finite Euler product). smooth_count_lower: products of at most floor(log x / log y) wheels with
    repetition are distinct and at most x. smooth_buchstab: sort by largest prime factor.'
sources:
- title: K. Ford, Sieve Methods Lecture Notes, Spring 2023
  url: https://mail.ford126.web.illinois.edu/sieve2023.pdf
  relationship: Chapter 5, Theorem 5.1 (upper bound (5.4)) and its lower-bound argument
related:
- node: ShareBounds
  note: expands the reciprocal of the survivor share as a sum over the numbers built from the wheels,
    the alpha = 1 case
- node: BuchstabIdentity
  note: the same identity for survivors instead of smooth numbers
