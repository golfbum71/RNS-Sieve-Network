node:
  id: BrunPureSieve.v1
  family: BrunPureSieve
  version: v1
  order: 62
  kind: paper
  status: active
  improves: SurvivorCount and Sawtooth count survivors exactly; this node shows how inclusion-exclusion
    stopped early brackets that count from above and below, the step Brun's sieve and the fundamental
    lemma are built on.
  title: truncated inclusion-exclusion for the wheels (Brun's pure sieve)
  description: Count the survivors of prime wheels among 1 to N by inclusion-exclusion over sets of
    wheels. Stopping after the sets of at most an even number of wheels overcounts, stopping after an
    odd number undercounts (the Bonferroni inequalities), and going all the way is exact (Legendre's
    identity). Exact and finite; the starting point of Brun's sieve.
conclusions:
- id: bonferroni_even
  declaration: RNS.BrunPureSieve.bonferroni_even
  summary: Inclusion-exclusion stopped at an even number of wheels is at least the survivor count.
  imports: []
  imports_status: none
  justifications:
